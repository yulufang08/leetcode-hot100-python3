rst == len(nums) or nums[first] != target:\n            return [-1, -1]\n        return [first, boundary(True) - 1]\n"}, {"order": 66, "id": 33, "title": "搜索旋转排序数组", "english_title": "Search in Rotated Sorted Array", "slug": "search-in-rotated-sorted-array", "difficulty": "MEDIUM", "category": "二分查找", "url": "https://leetcode.cn/problems/search-in-rotated-sorted-array/", "summary": "在由互不相同的升序数组旋转得到的数组中查找目标，返回其下标或 -1。", "approach": "每次二分先判断左右哪一半有序，再判断 target 是否落在该有序半段内。", "steps": ["先比较中点与目标，相等时立即返回。", "若 nums[left]\u003c=nums[mid]，左半段有序；用取值范围判断目标是否在这里。", "否则右半段有序，同样依据范围选择保留的一侧。", "搜索区间耗尽仍未命中，返回 -1。"], "why": "互不相同且只有一个旋转断点，保证每次至少有半段有序；范围判断可以确定是否包含目标，因此每轮排除的一侧都不可能藏有答案。", "time_complexity": "O(log n)", "space_complexity": "O(1)", "complexity_notes": "输入元素互不相同是保持每次可确定有序半段的关键；带重复值是另一道题。", "pitfalls": ["识别左半段时用 \u003c=，才能处理单元素区间。", "比较目标范围时，一端已由中点相等判断排除，边界不要混写。"], "code": "from typing import List\n\nclass Solution:\n    def search(self, nums: List[int], target: int) -> int:\n        left, right = 0, len(nums) - 1\n        while left \u003c= right:\n            mid = (left + right) // 2\n            if nums[mid] == target:\n                return mid\n            if nums[left] \u003c= nums[mid]:\n                if nums[left] \u003c= target \u003c nums[mid]:\n                    right = mid - 1\n                else:\n                    left = mid + 1\n            else:\n                if nums[mid] \u003c target \u003c= nums[right]:\n                    left = mid + 1\n                else:\n                    right = mid - 1\n        return -1\n"}, {"order": 67, "id": 153, "title": "寻找旋转排序数组中的最小值", "english_title": "Find Minimum in Rotated Sorted Array", "slug": "find-minimum-in-rotated-sorted-array", "difficulty": "MEDIUM", "category": "二分查找", "url": "https://leetcode.cn/problems/find-minimum-in-rotated-sorted-array/", "summary": "求由互不相同的升序数组旋转得到的非空数组中的最小值。", "approach": "比较中点和右端值：中点更大则最小值在右侧，否则最小值在中点或其左侧。", "steps": ["维护一个必定包含最小值的闭区间 [left,right]。", "nums[mid]>nums[right] 表示中点处于旋转前的高值段，令 left=mid+1。", "否则中点到右端有序，最小值不在中点右侧，令 right=mid。", "区间只剩一个位置时返回该元素。"], "why": "与右端比较可识别断点所在方向；每次更新都保留最小值，而区间严格缩小，所以最终留下的唯一元素就是最小值。", "time_complexity": "O(log n)", "space_complexity": "O(1)", "complexity_notes": "数组非空且无重复；未发生实际旋转也能使用同一过程。", "pitfalls": ["right=mid 不能写成 mid-1，因为中点本身可能是最小值。", "带重复值时相等无法直接判断方向，需要另一种处理。"], "code": "from typing import List\n\nclass Solution:\n    def findMin(self, nums: List[int]) -> int:\n        left, right = 0, len(nums) - 1\n        while left \u003c right:\n            mid = (left + right) // 2\n            if nums[mid] > nums[right]:\n                left = mid + 1\n            else:\n                right = mid\n        return nums[left]\n"}, {"order": 68, "id": 4, "title": "寻找两个正序数组的中位数", "english_title": "Median of Two Sorted Arrays", "slug": "median-of-two-sorted-arrays", "difficulty": "HARD", "category": "二分查找", "url": "https://leetcode.cn/problems/median-of-two-sorted-arrays/", "summary": "给定两个升序数组，求它们合并后的中位数，要求无需实际合并。", "approach": "在较短数组上二分分割点，配合另一数组的分割点，使左半元素总数正确且左右满足有序分割。", "steps": ["令 nums1 为较短数组，在其中选择 i 个元素放入左半。", "左半总数固定为 (m+n+1)//2，因此另一数组取 j=half-i 个元素。", "用正负无穷处理空半段；若 A_left>B_right，i 太大，向左移动；若 B_left>A_right，i 太小，向右移动。", "交叉条件都满足时，奇数长度取左半最大值；偶数长度取左半最大与右半最小的平均。"], "why": "两数组各自有序，交叉条件 A_left\u003c=B_right 且 B_left\u003c=A_right 保证左半所有元素不大于右半所有元素；左半数量预先固定，因此边界元素就是中位数。", "time_complexity": "O(log(min(m,n)+1))", "space_complexity": "O(1)", "complexity_notes": "m、n 为两数组长度，合计至少 1。二分较短数组的 m+1 个分割位置；一数组为空时也是常数时间。未创建合并数组。", "pitfalls": ["必须在较短数组上二分，保证另一分割点始终合法。", "左半元素数量使用 (m+n+1)//2，让奇数长度的额外元素留在左边。", "空分割边界用无穷值，避免负下标误取末元素。"], "code": "from typing import List\n\nclass Solution:\n    def findMedianSortedArrays(self, nums1: List[int], nums2: List[int]) -> float:\n        if len(nums1) > len(nums2):\n            nums1, nums2 = nums2, nums1\n        m, n = len(nums1), len(nums2)\n        half = (m + n + 1) // 2\n        left, right = 0, m\n        while left \u003c= right:\n            i = (left + right) // 2\n            j = half - i\n            a_left = nums1[i - 1] if i else float(\"-inf\")\n            a_right = nums1[i] if i \u003c m else float(\"inf\")\n            b_left = nums2[j - 1] if j else float(\"-inf\")\n            b_right = nums2[j] if j \u003c n else float(\"inf\")\n            if a_left > b_right:\n                right = i - 1\n            elif b_left > a_right:\n                left = i + 1\n            else:\n                if (m + n) % 2:\n                    return float(max(a_left, b_left))\n                return (max(a_left, b_left) + min(a_right, b_right)) / 2.0\n        raise ValueError(\"数组必须有序且合计至少包含一个元素\")\n"}, {"order": 69, "id": 20, "title": "有效的括号", "english_title": "Valid Parentheses", "slug": "valid-parentheses", "difficulty": "EASY", "category": "栈", "url": "https://leetcode.cn/problems/valid-parentheses/", "summary": "判断只由三类括号组成的字符串是否按正确类型与嵌套顺序完全配对。", "approach": "左括号入栈，右括号必须匹配最近尚未配对的左括号。", "steps": ["建立右括号到对应左括号的映射。", "遇到左括号直接压栈。", "遇到右括号时，若栈空或栈顶类型不同则失败，否则弹出栈顶。", "扫描完必须栈空，才说明所有左括号也已配对。"], "why": "合法嵌套要求后打开的括号先关闭；栈恰好保存尚未关闭的括号顺序，逐个检查栈顶即可验证这一条件。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "n 为字符串长度；最坏情况下全部为左括号，栈大小为 n。", "pitfalls": ["右括号出现时先判断栈是否为空。", "扫描完成仍有左括号则不合法。"], "code": "class Solution:\n    def isValid(self, s: str) -> bool:\n        pairs = {\")\": \"(\", \"]\": \"[\", \"}\": \"{\"}\n        stack = []\n        for ch in s:\n            if ch in pairs:\n                if not stack or stack.pop() != pairs[ch]:\n                    return False\n            else:\n                stack.append(ch)\n        return not stack\n"}, {"order": 70, "id": 155, "title": "最小栈", "english_title": "Min Stack", "slug": "min-stack", "difficulty": "MEDIUM", "category": "栈", "url": "https://leetcode.cn/problems/min-stack/", "summary": "设计支持压栈、弹栈、读取栈顶及读取当前最小值的栈，各操作为常数时间。", "approach": "每层保存二元组 (当前值, 到这一层为止的最小值)，弹栈时同步恢复历史最小值。", "steps": ["压栈时，当前最小值为 value 与旧栈顶记录的最小值中的较小者。", "把数值和新的最小值一起入栈。", "弹栈只移除最后一对，上一层已保留正确的历史最小值。", "top 读取二元组第一项，getMin 读取第二项。"], "why": "每一层第二项始终等于这一层及其下方所有值的最小值；压入时用旧最小值更新、弹出时回到已保存状态，因而查询正确。", "time_complexity": "每次操作 O(1)（列表增删为摊还时间）", "space_complexity": "O(n)", "complexity_notes": "n 为当前栈元素数；Python list 尾部 append/pop 为摊还 O(1)。题目保证 pop、top、getMin 在非空栈上调用。", "pitfalls": ["重复最小值需要保存每一层的最小值，不能只维护一个全局变量。", "空栈压入首个元素时最小值就是它本身。"], "code": "class MinStack:\n    def __init__(self):\n        self.stack = []\n\n    def push(self, value: int) -> None:\n        minimum = min(value, self.stack[-1][1]) if self.stack else value\n        self.stack.append((value, minimum))\n\n    def pop(self) -> None:\n        self.stack.pop()\n\n    def top(self) -> int:\n        return self.stack[-1][0]\n\n    def getMin(self) -> int:\n        return self.stack[-1][1]\n"}, {"order": 71, "id": 394, "title": "字符串解码", "english_title": "Decode String", "slug": "decode-string", "difficulty": "MEDIUM", "category": "栈", "url": "https://leetcode.cn/problems/decode-string/", "summary": "把形如 k[片段] 且允许嵌套的编码字符串展开，重复次数可能是多位数。", "approach": "用栈保存进入括号前的字符串片段列表和重复次数，闭括号时完成这一层展开。", "steps": ["数字逐位累积为 number，而不是只读取最后一位。", "遇到 '['，把外层片段列表和 number 入栈，再开始新的内层。", "普通字母加入当前片段列表。", "遇到 ']'，连接内层片段、按次数重复，恢复外层并追加这段展开结果；最后连接最外层。"], "why": "栈中的每个帧保存尚未闭合括号的外层状态；处理闭括号时其内部已经完整解码，按次数展开后接回外层，因此由内向外得到正确结果。", "time_complexity": "O(n + dL)，上界", "space_complexity": "O(n + L)", "complexity_notes": "n 为编码长度，L 为最终展开长度，d 为最大嵌套深度。列表避免逐字字符串拼接的平方退化，但每层 join/重复仍会复制中间展开结果；深层且重复次数为 1 时同一内容可能复制多次，不能无条件说 O(n+L)。栈与同时存活的片段总空间为 O(n+L)。", "pitfalls": ["重复次数可能有多位，需要 number=number*10+digit。", "遇到 '[' 后要清零次数并重置当前层。", "闭括号必须恢复对应外层，不能只保留内层结果。"], "code": "class Solution:\n    def decodeString(self, s: str) -> str:\n        stack = []\n        parts = []\n        number = 0\n        for ch in s:\n            if ch.isdigit():\n                number = number * 10 + int(ch)\n            elif ch == \"[\":\n                stack.append((parts, number))\n                parts = []\n                number = 0\n            elif ch == \"]\":\n                inner = \"\".join(parts)\n                parts, repeat = stack.pop()\n                parts.append(inner * repeat)\n            else:\n                parts.append(ch)\n        return \"\".join(parts)\n"}, {"order": 72, "id": 739, "title": "每日温度", "english_title": "Daily Temperatures", "slug": "daily-temperatures", "difficulty": "MEDIUM", "category": "栈", "url": "https://leetcode.cn/problems/daily-temperatures/", "summary": "对每日温度，求还需等待几天才会出现严格更高温度；之后没有则填 0。", "approach": "维护温度非递增的下标栈，新温度更高时解决栈顶未确定的日期。", "steps": ["答案数组初始化为 0，栈保存尚未找到更高温度的下标。", "扫描当天温度；只要比栈顶对应温度高，就弹出该下标。", "弹出的日期答案为 当前下标-旧下标。", "当天最后入栈；扫描结束后仍在栈中的日期没有更高温度。"], "why": "某日留在栈中意味着至今没有遇到更高温度；首次触发弹栈的当天就是它之后最近的严格更高温度，所以间隔正确。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "每个下标最多入栈、出栈各一次，虽然有 while 循环但总工作量线性；输出数组另占 O(n)。", "pitfalls": ["要求严格更高，相等温度不能弹栈。", "栈存下标而非温度，才能计算等待天数。"], "code": "from typing import List\n\nclass Solution:\n    def dailyTemperatures(self, temperatures: List[int]) -> List[int]:\n        answer = [0] * len(temperatures)\n        stack = []\n        for i, value in enumerate(temperatures):\n            while stack and temperatures[stack[-1]] \u003c value:\n                previous = stack.pop()\n                answer[previous] = i - previous\n            stack.append(i)\n        return answer\n"}, {"order": 73, "id": 84, "title": "柱状图中最大的矩形", "english_title": "Largest Rectangle in Histogram", "slug": "largest-rectangle-in-histogram", "difficulty": "HARD", "category": "栈", "url": "https://leetcode.cn/problems/largest-rectangle-in-histogram/", "summary": "在宽度均为 1 的连续柱子中，找出能够被柱状图完全覆盖的最大矩形面积。", "approach": "使用高度非递减的下标栈，遇到更低柱子时确定被弹出柱子的最大可扩展宽度。", "steps": ["栈底放 -1，作为没有更矮左边界时的哨兵。", "扫描每根柱子，并在末尾虚拟添加高度 0，迫使未处理柱子出栈。", "当前高度低于栈顶时弹出下标 top；此时右边界是 i，左边界是弹出后的栈顶。", "计算 heights[top]×(i-stack[-1]-1)，更新最大面积，再把当前下标入栈。"], "why": "弹出柱子时当前柱子阻止它向右扩展，栈顶给出左侧不能跨越的边界。相同高度可以留在栈中，较早的同高柱子随后能取得更宽区间，最大面积不会遗漏。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "每个下标至多压栈和弹栈一次；末尾高度 0 只是虚拟值，不修改输入数组。", "pitfalls": ["宽度是 i-left-1，不是 i-left。", "末尾需要清栈，否则递增数组的答案会遗漏。", "栈底 -1 只是边界哨兵，不应访问 heights[-1]。"], "code": "from typing import List\n\nclass Solution:\n    def largestRectangleArea(self, heights: List[int]) -> int:\n        stack = [-1]\n        answer = 0\n        n = len(heights)\n        for i in range(n + 1):\n            current = heights[i] if i \u003c n else 0\n            while stack[-1] != -1 and heights[stack[-1]] > current:\n                height = heights[stack.pop()]\n                width = i - stack[-1] - 1\n                answer = max(answer, height * width)\n            stack.append(i)\n        return answer\n"}, {"order": 74, "id": 215, "title": "数组中的第K个最大元素", "english_title": "Kth Largest Element in an Array", "slug": "kth-largest-element-in-an-array", "difficulty": "MEDIUM", "category": "堆", "url": "https://leetcode.cn/problems/kth-largest-element-in-an-array/", "summary": "求数组按大小降序排列后的第 k 个元素，重复值分别占据排名。", "approach": "维护容量最多为 k 的最小堆，保留已经扫描元素中的 k 个最大值。", "steps": ["堆未满时直接加入新元素。", "堆满后，只有大于堆顶的元素才值得替换堆顶。", "每次更新后堆仍保存当前最大的 k 个元素。", "扫描结束后，堆中最小元素就是整体第 k 大。"], "why": "归纳维护堆内为当前前缀最大的 k 个值：较小的新值不能进入前 k，大于边界的新值替换最小者即可保持集合正确。", "time_complexity": "O(n log(k+1))", "space_complexity": "O(k)", "complexity_notes": "采用最小堆，复杂度有确定性保证；通常记作 O(n log k)，写 log(k+1) 也涵盖 k=1 时 O(n)。没有修改输入，也没有使用期望线性的快速选择。", "pitfalls": ["第 k 大按元素计数，不能先去重。", "保留最大 k 个值时要用最小堆，让边界在堆顶。"], "code": "import heapq\nfrom typing import List\n\nclass Solution:\n    def findKthLargest(self, nums: List[int], k: int) -> int:\n        heap = []\n        for value in nums:\n            if len(heap) \u003c k:\n                heapq.heappush(heap, value)\n            elif value > heap[0]:\n                heapq.heapreplace(heap, value)\n        return heap[0]\n"}, {"order": 75, "id": 347, "title": "前 K 个高频元素", "english_title": "Top K Frequent Elements", "slug": "top-k-frequent-elements", "difficulty": "MEDIUM", "category": "堆", "url": "https://leetcode.cn/problems/top-k-frequent-elements/", "summary": "返回数组中出现次数最多的 k 个不同元素，结果顺序任意。", "approach": "统计频次后按出现次数建桶，从高频桶向低频桶收集 k 个元素。", "steps": ["用 Counter 得到每个不同元素的出现次数。", "频次范围为 1..n，创建 n+1 个桶；把元素放入对应频次桶。", "按频次从 n 向 1 扫描。", "收集到 k 个元素立即返回，无需排序所有元素。"], "why": "桶下标就是频次，从高到低访问使已经选出的元素频次不低于任何尚未访问的元素，因此前 k 个就是所需高频元素。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "n 为输入长度，u 为不同元素数：统计 O(n)、入桶 O(u)、扫描最多 O(n+u)，桶和计数表 O(n+u)=O(n)。Python 哈希表按平均复杂度计算；题目保证高频元素集合唯一。", "pitfalls": ["桶里存元素，不是频次数值。", "输出无需按数值大小排序。", "无需依赖 Counter.most_common 的具体内部实现。"], "code": "from collections import Counter\nfrom typing import List\n\nclass Solution:\n    def topKFrequent(self, nums: List[int], k: int) -> List[int]:\n        counts = Counter(nums)\n        buckets = [[] for _ in range(len(nums) + 1)]\n        for value, count in counts.items():\n            buckets[count].append(value)\n        answer = []\n        for count in range(len(nums), 0, -1):\n            for value in buckets[count]:\n                answer.append(value)\n                if len(answer) == k:\n                    return answer\n        return answer\n"}, {"order": 76, "id": 295, "title": "数据流的中位数", "english_title": "Find Median from Data Stream", "slug": "find-median-from-data-stream", "difficulty": "HARD", "category": "堆", "url": "https://leetcode.cn/problems/find-median-from-data-stream/", "summary": "持续插入整数，并在任意时刻快速查询已插入元素的中位数。", "approach": "用大根堆保存较小的一半、小根堆保存较大的一半，保持较小堆数量相等或多一个。", "steps": ["Python heapq 是小根堆，因此用负数实现保存较小一半的大根堆 lower。", "新值先入 lower，再把 lower 的最大值转移到 upper，保证两边取值顺序。", "若 upper 元素更多，把其最小值转回 lower，恢复数量平衡。", "奇数总量取 lower 最大值；偶数总量取两堆边界平均。"], "why": "每次转移保持 lower 中每个值都不大于 upper 中每个值；数量平衡使边界元素正好位于整体排序的中间位置，因此查询中位数正确。", "time_complexity": "addNum: O(log n)；findMedian: O(1)", "space_complexity": "O(n)", "complexity_notes": "n 为已插入元素数。每次插入执行常数次堆操作；查询时题目保证至少插入了一个元素。", "pitfalls": ["lower 存的是负数，读取和转移时要恢复符号。", "偶数数量取平均而不是只取一个堆顶。", "大小关系与数量关系两个不变量都要维持。"], "code": "import heapq\n\nclass MedianFinder:\n    def __init__(self):\n        self.lower = []\n        self.upper = []\n\n    def addNum(self, num: int) -> None:\n        heapq.heappush(self.lower, -num)\n        heapq.heappush(self.upper, -heapq.heappop(self.lower))\n        if len(self.upper) > len(self.lower):\n            heapq.heappush(self.lower, -heapq.heappop(self.upper))\n\n    def findMedian(self) -> float:\n        if len(self.lower) > len(self.upper):\n            return float(-self.lower[0])\n        return (-self.lower[0] + self.upper[0]) / 2.0\n"}, {"order": 77, "id": 121, "title": "买卖股票的最佳时机", "english_title": "Best Time to Buy and Sell Stock", "slug": "best-time-to-buy-and-sell-stock", "difficulty": "EASY", "category": "贪心算法", "url": "https://leetcode.cn/problems/best-time-to-buy-and-sell-stock/", "summary": "给出按天排列的股票价格，只能先买后卖各一次，求最大非负收益。", "approach": "从左到右维护历史最低买入价，用当天卖出的收益更新答案。", "steps": ["初始最低价为正无穷、最大收益为 0。", "读入当天价格，更新截至当天的最低价格。", "计算当天价格减最低价格，并更新最大收益。"], "why": "卖出日期确定后，最优买入价一定是它之前的最低价；枚举所有卖出日期就覆盖了所有合法交易。先更新最低价允许当天的零收益，不会制造正收益的非法交易。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为价格数量；只维护两个标量。", "pitfalls": ["交易不能把卖出日放在买入日之前。", "价格持续下降时应返回 0，而不是负数。"], "code": "from typing import List\n\nclass Solution:\n    def maxProfit(self, prices: List[int]) -> int:\n        lowest = float(\"inf\")\n        best = 0\n        for price in prices:\n            lowest = min(lowest, price)\n            best = max(best, price - lowest)\n        return best\n"}, {"order": 78, "id": 55, "title": "跳跃游戏", "english_title": "Jump Game", "slug": "jump-game", "difficulty": "MEDIUM", "category": "贪心算法", "url": "https://leetcode.cn/problems/jump-game/", "summary": "数组中的数表示在当前位置最多能向右跳几步，判断能否从首位到达末位。", "approach": "维护已扫描的可达位置能够覆盖的最远下标。", "steps": ["最远可达下标 farthest 初始化为 0。", "扫描下标 i；若 i 已大于 farthest，说明出现不可跨越的断点。", "否则用 i + nums[i] 扩展 farthest。", "一旦 farthest 覆盖末位即可返回 True。"], "why": "一个可达下标允许选择从 0 到最大步长的任意跳跃，因此从起点到 farthest 的每个下标都可达。只在这个连续可达区间内扩展边界，既不会把不可达位置计入，也不会遗漏可行路径。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为数组长度；不需要记录具体跳跃路径。", "pitfalls": ["必须先检查当前位置可达，再用它更新边界。", "长度为 1 时已经位于终点，即使元素是 0 也可达。"], "code": "from typing import List\n\nclass Solution:\n    def canJump(self, nums: List[int]) -> bool:\n        farthest = 0\n        for i, step in enumerate(nums):\n            if i > farthest:\n                return False\n            farthest = max(farthest, i + step)\n            if farthest >= len(nums) - 1:\n                return True\n        return False\n"}, {"order": 79, "id": 45, "title": "跳跃游戏 II", "english_title": "Jump Game II", "slug": "jump-game-ii", "difficulty": "MEDIUM", "category": "贪心算法", "url": "https://leetcode.cn/problems/jump-game-ii/", "summary": "每个元素给出向右跳的最大距离，求从首位到末位的最少跳跃次数；题目保证终点可达。", "approach": "按跳跃次数划分可达区间，每扫描完当前层就扩展到下一层的最远边界。", "steps": ["end 表示当前跳跃次数所能覆盖的边界，farthest 表示再跳一次可达到的最远位置。", "扫描当前层中的下标，用 i + nums[i] 更新 farthest。", "走到 end 时，必须增加一次跳跃，并将 end 改为 farthest。", "仅扫描到倒数第二个下标，避免已经到达终点后再计一次跳跃。"], "why": "这相当于把广度优先搜索的一层压缩为一个区间。该层所有落点共同给出下一层可达边界，第一次覆盖终点的层数就是最少跳跃次数。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为数组长度；题目保证可达，因此不额外定义不可达时的返回值。", "pitfalls": ["循环不能包含最后一个下标，否则会多算一步。", "只有跨过整层边界时才能增加次数，不能每次 farthest 变大就加一。"], "code": "from typing import List\n\nclass Solution:\n    def jump(self, nums: List[int]) -> int:\n        jumps = 0\n        end = farthest = 0\n        for i in range(len(nums) - 1):\n            farthest = max(farthest, i + nums[i])\n            if i == end:\n                jumps += 1\n                end = farthest\n        return jumps\n"}, {"order": 80, "id": 763, "title": "划分字母区间", "english_title": "Partition Labels", "slug": "partition-labels", "difficulty": "MEDIUM", "category": "贪心算法", "url": "https://leetcode.cn/problems/partition-labels/", "summary": "把字符串切成尽量多的连续片段，使任一字母只出现在其中一个片段，返回各片段长度。", "approach": "预先记录每个字符的最后位置，扫描时将当前片段延长到所有已遇字符的最后位置。", "steps": ["构建字符到最后出现下标的映射 last。", "片段起点 start 与右边界 end 从 0 开始。", "遇到字符 ch，令 end = max(end, last[ch])。", "当扫描位置等于 end 时，立即切出片段并开始下一段。"], "why": "end 之前的字符都不会再出现在 end 之后，所以此处可以合法切分。在到达 end 之前至少还有一个字符会再次出现，提前切分必然违法；每次取最早的合法切点便得到最多片段。", "time_complexity": "O(n)", "space_complexity": "O(Σ)，不含输出", "complexity_notes": "Σ 为不同字符数；题目限定小写英文字母时 Σ ≤ 26。输出列表另占 O(k)，k 为片段数。", "pitfalls": ["切分依据是片段内所有字符的最远最后位置，而不是当前字符自己的最后位置。", "长度应为 end - start + 1。"], "code": "from typing import List\n\nclass Solution:\n    def partitionLabels(self, s: str) -> List[int]:\n        last = {ch: i for i, ch in enumerate(s)}\n        result = []\n        start = end = 0\n        for i, ch in enumerate(s):\n            end = max(end, last[ch])\n            if i == end:\n                result.append(end - start + 1)\n                start = i + 1\n        return result\n"}, {"order": 81, "id": 70, "title": "爬楼梯", "english_title": "Climbing Stairs", "slug": "climbing-stairs", "difficulty": "EASY", "category": "动态规划", "url": "https://leetcode.cn/problems/climbing-stairs/", "summary": "每次可以登 1 级或 2 级台阶，计算登上 n 级台阶的不同走法数。", "approach": "最后一步来自 n-1 或 n-2 级，因此用两个变量滚动计算斐波那契式递推。", "steps": ["定义 f(i) 为到达第 i 级的走法数。", "设 f(0)=1、f(1)=1，其中 f(0) 表示不走的唯一方式。", "按 f(i)=f(i-1)+f(i-2) 递推。", "只保留相邻两个状态，循环后返回 f(n)。"], "why": "任何走法的最后一步只能是 1 级或 2 级，两类走法互不重叠且覆盖全部情况，分别对应此前到达 n-1、n-2 的走法。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "按通常的整数运算计数分析；题目 n ≤ 45，整数大小受限。", "pitfalls": ["正确初始化 n=1 和 n=2 的答案，避免下标或循环次数偏移。"], "code": "class Solution:\n    def climbStairs(self, n: int) -> int:\n        previous, current = 0, 1\n        for _ in range(n):\n            previous, current = current, previous + current\n        return current\n"}, {"order": 82, "id": 118, "title": "杨辉三角", "english_title": "Pascal's Triangle", "slug": "pascals-triangle", "difficulty": "EASY", "category": "动态规划", "url": "https://leetcode.cn/problems/pascals-triangle/", "summary": "生成指定行数的杨辉三角：每行首尾为 1，其余元素等于上一行相邻两数之和。", "approach": "逐行构建，用已生成的上一行填充下一行内部元素。", "steps": ["第 r 行（下标从 0 开始）长度为 r+1，先全部填成 1。", "对内部列 j，赋值 result[r-1][j-1] + result[r-1][j]。", "将当前行加入答案，继续构建下一行。"], "why": "构建第 r 行时，上一行已经完全正确；首尾按定义为 1，所有内部元素按定义由正确的两个前驱相加。因此逐行归纳可得全部结果正确。", "time_complexity": "O(r²)", "space_complexity": "O(r²)，含输出", "complexity_notes": "r 为行数，总共输出 r(r+1)/2 个元素。当前行最多 O(r)，除此之外辅助空间 O(1)。", "pitfalls": ["内部列从 1 到 r-1，不需要访问上一行的越界位置。", "每行必须新建列表，不能把同一个可变列表反复加入答案。"], "code": "from typing import List\n\nclass Solution:\n    def generate(self, numRows: int) -> List[List[int]]:\n        result = []\n        for r in range(numRows):\n            row = [1] * (r + 1)\n            for j in range(1, r):\n                row[j] = result[r - 1][j - 1] + result[r - 1][j]\n            result.append(row)\n        return result\n"}, {"order": 83, "id": 198, "title": "打家劫舍", "english_title": "House Robber", "slug": "house-robber", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/house-robber/", "summary": "房屋沿直线排列，不能同时取相邻房屋的财物，求能够取得的最大总金额。", "approach": "对每间房比较跳过它与选择它这两种方案，并滚动保存最优前缀状态。", "steps": ["定义 f(i) 为前 i 间房能够取得的最大金额。", "跳过第 i 间房得到 f(i-1)，选择它则得到 f(i-2)+money。", "转移为 f(i)=max(f(i-1), f(i-2)+money)。", "初始化两个空前缀状态为 0，并逐房更新。"], "why": "任意最优方案要么没有选择当前房屋，要么选择了当前房屋且不能选择上一间。两种情况分别缩减为已有前缀的最优解，取较大值不会遗漏合法方案。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为房屋数量；只保留最近两个前缀状态。", "pitfalls": ["更新两个状态时必须使用旧值，可利用 Python 同时赋值。", "这道题不是逐个选择金额最大的房屋，局部最大可能挡住更好的组合。"], "code": "from typing import List\n\nclass Solution:\n    def rob(self, nums: List[int]) -> int:\n        two_back = one_back = 0\n        for money in nums:\n            two_back, one_back = one_back, max(one_back, two_back + money)\n        return one_back\n"}, {"order": 84, "id": 279, "title": "完全平方数", "english_title": "Perfect Squares", "slug": "perfect-squares", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/perfect-squares/", "summary": "把正整数 n 表示成若干个完全平方数的和，允许重复使用，求最少项数。", "approach": "对每个总和枚举最后加入的平方数，使用最小计数动态规划。", "steps": ["预计算不大于 n 的所有正完全平方数。", "dp[0]=0，其余状态初始化为足够大的值。", "按总和 value 从小到大遍历，枚举 square ≤ value。", "用 dp[value-square]+1 更新 dp[value]，返回 dp[n]。"], "why": "最优分解中的最后一项必是某个平方数 square；去掉它后剩余总和的分解也必须最优，否则能改进原方案。枚举全部最后一项便给出了完整且最优的转移。", "time_complexity": "O(n√n)", "space_complexity": "O(n)", "complexity_notes": "平方数表占 O(√n)，dp 表占 O(n)；总和正序保证更小总和已计算。", "pitfalls": ["1 也是完全平方数，所以任意正整数都有解。", "平方数可以重复使用，不是每个平方数最多选一次。"], "code": "from math import isqrt\n\nclass Solution:\n    def numSquares(self, n: int) -> int:\n        squares = [i * i for i in range(1, isqrt(n) + 1)]\n        dp = [0] + [n + 1] * n\n        for value in range(1, n + 1):\n            for square in squares:\n                if square > value:\n                    break\n                dp[value] = min(dp[value], dp[value - square] + 1)\n        return dp[n]\n"}, {"order": 85, "id": 322, "title": "零钱兑换", "english_title": "Coin Change", "slug": "coin-change", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/coin-change/", "summary": "使用给定的正整数硬币面额，数量不限，凑出目标金额需要的最少硬币数；无法凑出则返回 -1。", "approach": "按金额递增，枚举最后使用的硬币，计算完全背包的最小硬币数。", "steps": ["dp[value] 表示恰好组成 value 的最少硬币数。", "dp[0]=0，其他金额初始化为 amount+1，表示暂不可达。", "对每个金额枚举面额 coin ≤ value，转移 dp[value]=min(dp[value], dp[value-coin]+1)。", "若目标状态仍为初始值，返回 -1；否则返回最少数量。"], "why": "任意非空最优组合都有一枚最后的硬币。移除它后需要凑出的更小金额已经求得最优值，枚举每种面额便覆盖全部组合；不可达状态也不会产生比哨兵更小的错误答案。", "time_complexity": "O(Ak)", "space_complexity": "O(A)", "complexity_notes": "A 为目标金额，k 为硬币种数；所有面额为正，因此总和递增的依赖无环。", "pitfalls": ["普通面额体系不能用优先拿大面额的贪心，例如 [1,3,4] 凑 6。", "amount=0 应返回 0；不可达金额必须返回 -1。"], "code": "from typing import List\n\nclass Solution:\n    def coinChange(self, coins: List[int], amount: int) -> int:\n        unreachable = amount + 1\n        dp = [0] + [unreachable] * amount\n        for value in range(1, amount + 1):\n            for coin in coins:\n                if coin \u003c= value:\n                    dp[value] = min(dp[value], dp[value - coin] + 1)\n        return -1 if dp[amount] == unreachable else dp[amount]\n"}, {"order": 86, "id": 139, "title": "单词拆分", "english_title": "Word Break", "slug": "word-break", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/word-break/", "summary": "判断字符串能否完整拆成词典中的若干单词，词典单词可以重复使用。", "approach": "用可拆前缀 DP，并通过 Trie 从每个可达前缀向右匹配单词，避免重复切片。", "steps": ["将词典插入 Trie，以一个特殊键标记完整单词的结尾。", "reachable[i] 表示前 i 个字符可以拆分，初始 reachable[0]=True。", "只从 reachable[i] 为 True 的位置出发，在 Trie 中匹配 s[i:]。", "遇到单词结尾就把对应前缀置为可达；匹配失败立即停止当前起点。", "最后检查 reachable[len(s)]。"], "why": "可达前缀后接任一词典单词，恰好构成一个新的可达前缀；反过来，任何合法拆分的最后一个单词都能从此前的可达前缀匹配出来。按起点递增遍历，因单词非空，新状态总在后方，最终得到全部合法拆分。", "time_complexity": "O(D+nL)", "space_complexity": "O(D+n)", "complexity_notes": "n 为字符串长度，D 为词典单词总长度，L 为最长单词长度（取 min(L,n) 亦可）。构建 Trie 为 O(D)，每个可达起点最多匹配 L 个字符；使用哈希表的平均 O(1) 操作。", "pitfalls": ["不能只选最先匹配或最长匹配的一个单词，需要保留所有可能的可达前缀。", "单词结尾需要独立标记，Trie 中的一个前缀未必是词典单词。"], "code": "from typing import List\n\nclass Solution:\n    def wordBreak(self, s: str, wordDict: List[str]) -> bool:\n        trie = {}\n        end = object()  # 与任何字符键都不同的单词结尾标记\n        for word in wordDict:\n            node = trie\n            for ch in word:\n                node = node.setdefault(ch, {})\n            node[end] = True\n\n        n = len(s)\n        reachable = [False] * (n + 1)\n        reachable[0] = True\n        for i in range(n):\n            if not reachable[i]:\n                continue\n            node = trie\n            for j in range(i, n):\n                if s[j] not in node:\n                    break\n                node = node[s[j]]\n                if end in node:\n                    reachable[j + 1] = True\n        return reachable[n]\n"}, {"order": 87, "id": 300, "title": "最长递增子序列", "english_title": "Longest Increasing Subsequence", "slug": "longest-increasing-subsequence", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/longest-increasing-subsequence/", "summary": "从数组中选择保持原顺序且严格递增的元素，求可选的最大长度；所选元素不必连续。", "approach": "维护每种递增子序列长度的最小末尾值，用二分查找更新 tails。", "steps": ["tails[k] 表示长度为 k+1 的严格递增子序列能够取得的最小末尾值。", "对新数 x，二分找到 tails 中第一个大于等于 x 的位置。", "若该位置不存在，则 x 可以扩展目前最长序列；否则用 x 替换该位置，让同长度序列更容易延长。", "最终 tails 的长度就是最长递增子序列长度。"], "why": "同样长度的递增序列，较小的末尾不比更大的末尾差。替换只改善可延长性，不缩短已存在的序列；追加意味着确实找到一个更长序列。tails 严格递增，使二分位置恰好对应 x 能延长的最长长度。", "time_complexity": "O(n log n)", "space_complexity": "O(n)", "complexity_notes": "实际辅助空间 O(ℓ)，ℓ 为答案长度；tails 存的是各长度最小末尾，不一定是输入中的同一条子序列。", "pitfalls": ["严格递增使用 bisect_left，相等值应替换而不能扩展长度。", "不要直接把 tails 当成需要返回的具体最长子序列。"], "code": "from bisect import bisect_left\nfrom typing import List\n\nclass Solution:\n    def lengthOfLIS(self, nums: List[int]) -> int:\n        tails = []\n        for value in nums:\n            i = bisect_left(tails, value)\n            if i == len(tails):\n                tails.append(value)\n            else:\n                tails[i] = value\n        return len(tails)\n"}, {"order": 88, "id": 152, "title": "乘积最大子数组", "english_title": "Maximum Product Subarray", "slug": "maximum-product-subarray", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/maximum-product-subarray/", "summary": "寻找非空连续子数组，使其中所有元素的乘积最大；数组可能含负数和零。", "approach": "同时维护以当前位置结尾的最大乘积和最小乘积，因为负数会交换两者的作用。", "steps": ["用首元素初始化 ending_max、ending_min 与全局 best。", "当前数 x 对应三种候选：只取 x、旧最大乘 x、旧最小乘 x。", "从三种候选分别选出新的结尾最大值与最小值。", "用新的 ending_max 更新全局答案。"], "why": "以当前位置结尾的非空子数组要么从当前元素开始，要么由上一个位置结尾的子数组延长而来。乘以正数保序、乘以负数反序，因此旧的两端极值足以得到全部乘积的新极值；全局取最大即覆盖所有结束位置。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为数组长度；按题目有界乘积/常用单位整数运算模型分析。", "pitfalls": ["不能只保留最大值：一个很小的负乘积以后乘负数可能变成最大值。", "新最大值和新最小值必须由同一组旧状态计算。", "子数组必须非空，不能把答案初始化为 0。"], "code": "from typing import List\n\nclass Solution:\n    def maxProduct(self, nums: List[int]) -> int:\n        ending_max = ending_min = best = nums[0]\n        for i in range(1, len(nums)):\n            value = nums[i]\n            candidates = (value, ending_max * value, ending_min * value)\n            ending_max, ending_min = max(candidates), min(candidates)\n            best = max(best, ending_max)\n        return best\n"}, {"order": 89, "id": 416, "title": "分割等和子集", "english_title": "Partition Equal Subset Sum", "slug": "partition-equal-subset-sum", "difficulty": "MEDIUM", "category": "动态规划", "url": "https://leetcode.cn/problems/partition-equal-subset-sum/", "summary": "判断正整数数组能否分成两个不交叠子集，使两边元素和相等且所有元素都分配到某一边。", "approach": "总和为偶数时，将问题转化为能否选出和为总和一半的 0/1 背包。", "steps": ["计算总和；若是奇数，不可能均分。", "target=total//2，dp[s] 表示已处理元素能否组成和 s，dp[0]=True。", "依次处理每个数 value，将 s 从 target 逆序遍历到 value。", "用 dp[s-value] 更新 dp[s]；最后读取 dp[target]。"], "why": "每个元素只有不选与选一次两种选择，转移正是二者的并集。逆序时 dp[s-value] 尚未使用当前元素，所以不会重复选同一元素。若找到和 target 的子集，剩余元素的和也为 target。", "time_complexity": "O(nS)", "space_complexity": "O(S)", "complexity_notes": "S 为总和的一半。奇数总和时只需 O(n) 求和；代码不改变输入数组。", "pitfalls": ["必须逆序更新容量；正序会把当前元素重复使用，变成完全背包。", "总和奇偶性需要先判断，不能直接做整除后继续。"], "code": "from typing import List\n\nclass Solution:\n    def canPartition(self, nums: List[int]) -> bool:\n        total = sum(nums)\n        if total % 2:\n            return False\n        target = total // 2\n        dp = [False] * (target + 1)\n        dp[0] = True\n        for value in nums:\n            # 逆序保证每个元素最多选择一次。\n            for capacity in range(target, value - 1, -1):\n                dp[capacity] = dp[capacity] or dp[capacity - value]\n        return dp[target]\n"}, {"order": 90, "id": 32, "title": "最长有效括号", "english_title": "Longest Valid Parentheses", "slug": "longest-valid-parentheses", "difficulty": "HARD", "category": "动态规划", "url": "https://leetcode.cn/problems/longest-valid-parentheses/", "summary": "给定仅由左右括号组成的字符串，求其中最长连续合法括号片段的长度。", "approach": "令 dp[i] 表示以 i 结尾的最长合法片段长度，只对右括号尝试向左找到匹配括号。", "steps": ["左括号处 dp[i]=0；合法非空片段必以右括号结尾。", "对右括号，先跳过前一位置结尾的合法片段，定位 left=i-dp[i-1]-1。", "若 left 合法且是左括号，则形成 dp[i-1]+2 长度的片段。", "再加上 left-1 结尾的合法长度，把紧邻的前一个片段拼接起来。", "扫描中维护最大 dp 值。"], "why": "前一位置结尾的合法片段可以整体包在一对匹配括号内。只有紧邻其左侧的左括号能与当前右括号配对；配对成功后，左边紧邻的合法片段还能拼接。这覆盖相邻的 () 以及嵌套、连续组合，且始终只生成合法连续片段。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "n 为字符串长度；每个结尾状态只做常数次查询。此实现选择 DP，另有单调计数双扫描 O(1) 空间方案。", "pitfalls": ["检查 left≥0 后才能访问字符，否则 Python 的负索引会误取尾部。", "不能漏掉 dp[left-1]，否则 ()() 之类拼接情况会少算。"], "code": "class Solution:\n    def longestValidParentheses(self, s: str) -> int:\n        dp = [0] * len(s)\n        best = 0\n        for i in range(1, len(s)):\n            if s[i] != \")\":\n                continue\n            left = i - dp[i - 1] - 1\n            if left >= 0 and s[left] == \"(\":\n                dp[i] = dp[i - 1] + 2\n                if left > 0:\n                    dp[i] += dp[left - 1]\n                best = max(best, dp[i])\n        return best\n"}, {"order": 91, "id": 62, "title": "不同路径", "english_title": "Unique Paths", "slug": "unique-paths", "difficulty": "MEDIUM", "category": "多维动态规划", "url": "https://leetcode.cn/problems/unique-paths/", "summary": "在 m×n 网格中，从左上角走到右下角，每次只能向右或向下，计算不同路径数。", "approach": "按行扫描，路径数等于来自上方与左方的路径数之和，并压缩为一维数组。", "steps": ["首行各格只有一路到达，因此 dp 全部初始化为 1。", "对其余每行，从左到右更新 dp[col] += dp[col-1]。", "更新前的 dp[col] 是上方路径数，已更新的 dp[col-1] 是左方路径数。", "可利用网格对称性把较小维度作为数组长度，返回最后一格。"], "why": "到达一格的最后一步只有从上方或左方两种互不重叠情况，故路径数相加。一维数组的扫描顺序保留了正确的上方旧状态与左方新状态，逐格归纳即可得到终点计数。", "time_complexity": "O(mn)", "space_complexity": "O(min(m,n))", "complexity_notes": "交换行列不影响路径总数；按题目答案范围的整数运算模型分析。", "pitfalls": ["左到右更新，才能让 dp[col-1] 代表本行状态。", "第一行和第一列的路径数均为 1。"], "code": "class Solution:\n    def uniquePaths(self, m: int, n: int) -> int:\n        rows, cols = max(m, n), min(m, n)\n        dp = [1] * cols\n        for _ in range(1, rows):\n            for col in range(1, cols):\n                dp[col] += dp[col - 1]\n        return dp[-1]\n"}, {"order": 92, "id": 64, "title": "最小路径和", "english_title": "Minimum Path Sum", "slug": "minimum-path-sum", "difficulty": "MEDIUM", "category": "多维动态规划", "url": "https://leetcode.cn/problems/minimum-path-sum/", "summary": "网格每格有一个非负代价，从左上走到右下，只能向右或向下，求沿途格子代价和的最小值。", "approach": "每格的最优代价是其格值加上上方、左方两种前驱中的较小值，使用一维 DP。", "steps": ["dp[col] 保存当前处理位置从起点到达的最小代价。", "起点直接取自己的格值；首行只有左方、首列只有上方可以到达。", "其他位置更新为 min(上方旧 dp[col], 左方新 dp[col-1])+grid[row][col]。", "行优先、列递增遍历，读取右下角的状态。"], "why": "任何到达当前格的路径都必须从上方或左方进入。在固定最后一步后，前缀路径必须使用对应前驱的最小代价，否则可替换成更好的前缀；因此取两种最优前驱的较小值就是最优代价。", "time_complexity": "O(mn)", "space_complexity": "O(n)", "complexity_notes": "m、n 为网格行列数；不修改输入矩阵，一维数组占列数空间。", "pitfalls": ["起点和首行、首列需要特殊处理，不能把不存在的前驱当作 0。", "路径的代价包括起点和终点。"], "code": "from typing import List\n\nclass Solution:\n    def minPathSum(self, grid: List[List[int]]) -> int:\n        cols = len(grid[0])\n        dp = [0] * cols\n        for row in range(len(grid)):\n            for col in range(cols):\n                value = grid[row][col]\n                if row == 0 and col == 0:\n                    dp[col] = value\n                elif row == 0:\n                    dp[col] = dp[col - 1] + value\n                elif col == 0:\n                    dp[col] += value\n                else:\n                    dp[col] = min(dp[col], dp[col - 1]) + value\n        return dp[-1]\n"}, {"order": 93, "id": 5, "title": "最长回文子串", "english_title": "Longest Palindromic Substring", "slug": "longest-palindromic-substring", "difficulty": "MEDIUM", "category": "多维动态规划", "url": "https://leetcode.cn/problems/longest-palindromic-substring/", "summary": "从字符串中找出最长的连续回文片段，若有多个最长答案，返回其中任意一个。", "approach": "枚举单字符中心与双字符中心，向两边对称扩展，记录最长区间。", "steps": ["回文可能长度为奇数或偶数，中心分别是一个字符或相邻两个字符之间。", "对每个中心，检查左右字符相等就继续扩展。", "扩展结束时，合法回文区间是 [left+1,right)，比较长度并更新最优边界。", "最后只切片一次，返回最长区间的字符串。"], "why": "每个回文都存在一个奇数或偶数中心，从该中心扩展一定能找到它。枚举全部中心并扩展到最大边界，涵盖所有回文候选，因此取最长者正确。", "time_complexity": "O(n²)", "space_complexity": "O(1)，不含返回字符串", "complexity_notes": "n 为字符串长度；所有字符相同会产生二次扩展。只在最后切片，返回字符串另占 O(n) 空间，不能在每次扩展中反复构造切片。", "pitfalls": ["必须同时覆盖奇数与偶数中心，例如 aba 和 abba。", "扩展停止后 left、right 已越过合法边界，需要恢复为 left+1 与 right。"], "code": "class Solution:\n    def longestPalindrome(self, s: str) -> str:\n        start = end = 0\n        for center in range(len(s)):\n            for left, right in ((center, center), (center, center + 1)):\n                while left >= 0 and right \u003c len(s) and s[left] == s[right]:\n                    left -= 1\n                    right += 1\n                if right - left - 1 > end - start:\n                    start, end = left + 1, right\n        return s[start:end]\n"}, {"order": 94, "id": 1143, "title": "最长公共子序列", "english_title": "Longest Common Subsequence", "slug": "longest-common-subsequence", "difficulty": "MEDIUM", "category": "多维动态规划", "url": "https://leetcode.cn/problems/longest-common-subsequence/", "summary": "给出两个字符串，求两者最长公共子序列的长度；子序列保留顺序，但字符不要求相邻。", "approach": "对两个前缀做动态规划，匹配字符时延长对角状态，否则舍弃一端取最大值，并压缩为一行。", "steps": ["定义 f(i,j) 为 text1 前 i 个字符与 text2 前 j 个字符的最长公共子序列长度。", "两端字符相同时 f(i,j)=f(i-1,j-1)+1，否则为 max(f(i-1,j),f(i,j-1))。", "空字符串对应的边界状态均为 0。", "更新一维 dp 时保存被覆盖的上方状态，用 diagonal 留住旧的左上方状态。", "把较短字符串放在列方向，降低空间占用。"], "why": "末尾字符相同时可以把它加入更短前缀的公共子序列，形成最优匹配；不同时二者不可能同时是公共子序列的最后一个字符，至少舍弃其中一端。两种情况完整覆盖最优子序列。", "time_complexity": "O(mn)", "space_complexity": "O(min(m,n))", "complexity_notes": "m、n 为两串长度；diagonal 必须在覆盖 dp[j] 之前保存旧值。代码只返回长度，不重建子序列。 任一字符串为空时直接返回，边界时间O(1)。", "pitfalls": ["子序列不同于子串，不匹配时不能直接把状态置零。", "压缩数组后不能误用已经覆盖的左上方值。"], "code": "class Solution:\n    def longestCommonSubsequence(self, text1: str, text2: str) -> int:\n        if not text1 or not text2:\n            return 0\n        if len(text1) \u003c len(text2):\n            text1, text2 = text2, text1\n        dp = [0] * (len(text2) + 1)\n        for ch1 in text1:\n            diagonal = 0\n            for j, ch2 in enumerate(text2, 1):\n                above = dp[j]\n                if ch1 == ch2:\n                    dp[j] = diagonal + 1\n                else:\n                    dp[j] = max(dp[j], dp[j - 1])\n                diagonal = above\n        return dp[-1]\n"}, {"order": 95, "id": 72, "title": "编辑距离", "english_title": "Edit Distance", "slug": "edit-distance", "difficulty": "MEDIUM", "category": "多维动态规划", "url": "https://leetcode.cn/problems/edit-distance/", "summary": "允许对字符串执行插入、删除、替换一个字符，求把第一个字符串变成第二个所需的最少操作数。", "approach": "以两个前缀为状态，匹配末尾字符时沿用对角值，不匹配时对三种操作取最小值加一。", "steps": ["f(i,j) 表示第一个串的前 i 字符变成第二个串的前 j 字符的最少操作数。", "空前缀边界为 f(i,0)=i、f(0,j)=j。", "字符相同则沿用 f(i-1,j-1)；不同则在删除 f(i-1,j)、插入 f(i,j-1)、替换 f(i-1,j-1) 中取最小加一。", "压缩为一行，左到右更新，并用变量保留旧对角状态。", "利用编辑距离的对称性，以较短字符串作为列方向。"], "why": "对末尾字符的最优编辑，可按最终操作归为删除、插入、替换，或相同字符直接保留。每种操作都把问题化为更短前缀的最优编辑距离，枚举三种转移并取最小值即得到全局最优。", "time_complexity": "O(mn)", "space_complexity": "O(min(m,n))", "complexity_notes": "m、n 为字符串长度；空串也由初始化正确处理。交换两串不改变允许这三种操作时的编辑距离。 任一字符串为空时直接返回另一字符串长度，边界时间O(1)。", "pitfalls": ["首行和首列应为前缀长度，而不是全部为 0。", "相同字符可零代价保留；替换代价仅在字符不同时加一。"], "code": "class Solution:\n    def minDistance(self, word1: str, word2: str) -> int:\n        if not word1 or not word2:\n            return len(word1) + len(word2)\n        if len(word1) \u003c len(word2):\n            word1, word2 = word2, word1\n        dp = list(range(len(word2) + 1))\n        for i, ch1 in enumerate(word1, 1):\n            diagonal = dp[0]\n            dp[0] = i\n            for j, ch2 in enumerate(word2, 1):\n                above = dp[j]\n                if ch1 == ch2:\n                    dp[j] = diagonal\n                else:\n                    dp[j] = 1 + min(above, dp[j - 1], diagonal)\n                diagonal = above\n        return dp[-1]\n"}, {"order": 96, "id": 136, "title": "只出现一次的数字", "english_title": "Single Number", "slug": "single-number", "difficulty": "EASY", "category": "技巧", "url": "https://leetcode.cn/problems/single-number/", "summary": "数组中一个数只出现一次，其余每个数都出现两次，找出唯一的单次元素。", "approach": "将所有元素按位异或，利用相同数异或抵消。", "steps": ["答案变量初始化为 0。", "逐个执行 answer ^= value。", "所有成对元素抵消后，留下单次元素。"], "why": "异或满足交换律和结合律，且 x^x=0、0^x=x，因此不论重复元素相隔多远，都可以重新分组抵消；只出现一次的元素不会被消除。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "按题目固定范围整数的位运算成本分析；无需修改数组或记录频次。", "pitfalls": ["此法依赖其他元素恰好出现两次，不能不加分析地用于任意重复次数。", "异或 ^ 不是乘方运算。"], "code": "from typing import List\n\nclass Solution:\n    def singleNumber(self, nums: List[int]) -> int:\n        answer = 0\n        for value in nums:\n            answer ^= value\n        return answer\n"}, {"order": 97, "id": 169, "title": "多数元素", "english_title": "Majority Element", "slug": "majority-element", "difficulty": "EASY", "category": "技巧", "url": "https://leetcode.cn/problems/majority-element/", "summary": "找出数组中出现次数超过长度一半的元素，题目保证该元素存在。", "approach": "使用 Boyer–Moore 投票，把不同元素成对抵消，保留最后的候选值。", "steps": ["票数 count 为 0 时，把当前元素设为 candidate。", "当前元素等于 candidate 就加一票，否则减一票。", "扫描结束返回 candidate。"], "why": "删除一对不同元素不会改变多数元素的身份：它最多损失一个票，而其他元素也损失一个。多数元素数量超过所有其他元素的总和，所以全部可能的抵消结束后，剩余候选只能是它。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "题目保证多数元素存在，所以无需第二遍验证。若取消保证，必须再统计候选出现次数。", "pitfalls": ["candidate 的当前票数不是它在整个数组中的真实出现次数。", "没有多数元素保证的变体不能直接返回候选。"], "code": "from typing import List\n\nclass Solution:\n    def majorityElement(self, nums: List[int]) -> int:\n        candidate = None\n        count = 0\n        for value in nums:\n            if count == 0:\n                candidate = value\n            count += 1 if value == candidate else -1\n        return candidate\n"}, {"order": 98, "id": 75, "title": "颜色分类", "english_title": "Sort Colors", "slug": "sort-colors", "difficulty": "MEDIUM", "category": "技巧", "url": "https://leetcode.cn/problems/sort-colors/", "summary": "数组仅含 0、1、2，要求原地将同类元素排在一起，整体顺序为 0、1、2。", "approach": "荷兰国旗三指针法，将数组维护成已归类的三个区域与一个待处理区域。", "steps": ["left 指向下一个 0 的位置，right 指向下一个 2 的位置，i 扫描未处理区。", "遇到 0 与 left 交换，left 和 i 都前进。", "遇到 1 只前进 i。", "遇到 2 与 right 交换，right 后退；新交换到 i 的值尚未检查，i 不前进。"], "why": "循环保持 [0,left) 全为 0、[left,i) 全为 1、(right,n) 全为 2，[i,right] 待处理。每次操作缩短待处理区并保持这三个区域的性质，结束时数组全部有序。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "每次操作至少缩短待处理区一个位置；仅在输入数组上交换，不调用排序。", "pitfalls": ["与右边交换 2 后不能立刻增加 i，否则会跳过刚交换来的未处理元素。", "扫描条件是 i ≤ right，右边界的元素也需要处理。"], "code": "from typing import List\n\nclass Solution:\n    def sortColors(self, nums: List[int]) -> None:\n        left = i = 0\n        right = len(nums) - 1\n        while i \u003c= right:\n            if nums[i] == 0:\n                nums[left], nums[i] = nums[i], nums[left]\n                left += 1\n                i += 1\n            elif nums[i] == 1:\n                i += 1\n            else:\n                nums[i], nums[right] = nums[right], nums[i]\n                right -= 1\n"}, {"order": 99, "id": 31, "title": "下一个排列", "english_title": "Next Permutation", "slug": "next-permutation", "difficulty": "MEDIUM", "category": "技巧", "url": "https://leetcode.cn/problems/next-permutation/", "summary": "原地把当前整数排列改成字典序紧邻且更大的排列；如果已是最大排列，则改为最小排列。", "approach": "寻找最右侧可增大的转折点，用后缀中刚好更大的元素替换，再反转后缀使其最小。", "steps": ["从右向左寻找 nums[i] \u003c nums[i+1] 的最右侧位置 i，此时右侧后缀单调不增。", "若找到 i，从右向左找到第一个 nums[j] > nums[i]，它就是后缀里最小的可替换更大值。", "交换 i、j 后，后缀仍单调不增；用双指针反转为最小的升序。", "若不存在转折点，直接反转整个数组。"], "why": "把改变放在最靠右的可增加位置，可以尽可能保留原排列前缀；选择最小的更大替代值，使增量最小；再把余下后缀改成最小顺序。这三个选择共同保证得到紧邻的下一个排列。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "定位、交换与双指针反转都是线性或常数成本。不要使用切片反转赋值来声称 O(1) 空间。", "pitfalls": ["定位转折点使用严格小于，找替代值使用严格大于，才能正确处理重复元素。", "题目要求原地修改且返回 None，而不是返回新列表。"], "code": "from typing import List\n\nclass Solution:\n    def nextPermutation(self, nums: List[int]) -> None:\n        i = len(nums) - 2\n        while i >= 0 and nums[i] >= nums[i + 1]:\n            i -= 1\n        if i >= 0:\n            j = len(nums) - 1\n            while nums[j] \u003c= nums[i]:\n                j -= 1\n            nums[i], nums[j] = nums[j], nums[i]\n\n        left, right = i + 1, len(nums) - 1\n        while left \u003c right:\n            nums[left], nums[right] = nums[right], nums[left]\n            left += 1\n            right -= 1\n"}, {"order": 100, "id": 287, "title": "寻找重复数", "english_title": "Find the Duplicate Number", "slug": "find-the-duplicate-number", "difficulty": "MEDIUM", "category": "技巧", "url": "https://leetcode.cn/problems/find-the-duplicate-number/", "summary": "长度 n+1 的数组中，每个数都在 1..n 内，只有一个数重复且可能出现多次；不能修改数组，要求常数额外空间找出重复数。", "approach": "把下标到 nums[下标] 看成带环的函数图，用 Floyd 快慢指针定位环入口。", "steps": ["从下标 0 出发，下一节点定义为 nums[index]。", "慢指针每次走一步，快指针每次走两步，直到在环内相遇。", "将一个指针重置为 0，另一个留在相遇点。", "二者改为每次走一步，再次相遇的下标就是环入口，也就是重复数。"], "why": "由于值都落在 1..n，0 不会被指向，沿函数边必然进入环。入口有来自路径与来自环内的两个前驱，因此其值出现至少两次，按题目的唯一重复值保证就是目标。设入口前距离为 μ、环长为 λ，首次快慢相遇时慢指针步数 t 满足 t≡0(mod λ)，于是入口距相遇点的环上距离与 μ 同余，两指针同步行走 μ 步便在入口相遇。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "下标节点最多 n+1 个，两阶段都只遍历线性数量的边；完全不修改输入，也不建立集合。", "pitfalls": ["第一阶段必须至少移动一次再比较，两个指针都从 0 开始时不能直接用 while slow != fast。", "第二阶段重置到与第一阶段一致的起点 0，避免混用不同初始化版本。", "这种映射依赖 1..n 的数值范围，不适用于任意数组。"], "code": "from typing import List\n\nclass Solution:\n    def findDuplicate(self, nums: List[int]) -> int:\n        slow = fast = 0\n        while True:\n            slow = nums[slow]\n            fast = nums[nums[fast]]\n            if slow == fast:\n                break\n\n        slow = 0\n        while slow != fast:\n            slow = nums[slow]\n            fast = nums[fast]\n        return slow\n"}];

$('category').innerHTML += categories.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
function highlight(line) {
  const pattern = /#[^\n]*|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|\b(?:class|def|return|for|in|if|elif|else|while|and|or|not|None|True|False|import|from|as|with|pass|break|continue|raise|yield|try|except|lambda|assert)\b|\b\d+(?:\.\d+)?\b/g;
  let out='',end=0;
  for (const match of line.matchAll(pattern)) {
    out += esc(line.slice(end,match.index));
    const token=match[0],kind=token.startsWith('#')?'comment':/^["']/.test(token)?'string':/^\d/.test(token)?'number':'keyword';
    out += `<span class="tok-${kind}">${esc(token)}</span>`;
    end=match.index+token.length;
  }
  return out+esc(line.slice(end));
}
function article(q) {
  const code=q.code.trimEnd().split('\n').map((line,i)=>`<div class="code-line"><span class="line-no">${i+1}</span><span class="line-text">${highlight(line)||' '}</span></div>`).join('');
  return `<article class="card" id="question-${q.id}"><div class="card-head"><div><div class="order">官方题单顺序 ${q.order} / 100</div><h2>${q.id}. ${esc(q.title)}</h2><div class="badges"><span class="badge">${esc(q.category)}</span><span class="badge difficulty-${q.difficulty}">${DIFFICULTY[q.difficulty]}</span></div></div><a class="original" href="${q.url}" target="_blank" rel="noopener">查看原题 ↗</a></div><section class="section"><h3>题意简述</h3><p>${esc(q.summary)}</p></section><section class="section"><h3>核心思路</h3><p class="idea">${esc(q.approach)}</p></section><section class="section"><h3>解题步骤</h3><ol class="steps">${q.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section><section class="section"><h3>为什么成立</h3><p class="why">${esc(q.why)}</p></section><section class="section"><h3>复杂度</h3><div class="complexity"><div class="metric"><small>时间</small><b>${esc(q.time_complexity)}</b></div><div class="metric"><small>空间</small><b>${esc(q.space_complexity)}</b></div></div><p class="notes">${esc(q.complexity_notes)}</p></section><section class="section"><h3>易错点</h3><ul class="pitfalls">${q.pitfalls.map(s=>`<li>${esc(s)}</li>`).join('')}</ul></section><div class="code-header"><h3>Python3 解法</h3><button class="copy" data-copy="${q.id}">复制代码</button></div><div class="code">${code}</div><label class="mark"><input type="checkbox" data-done="${q.id}" ${done.has(q.id)?'checked':''}>我已掌握这道题</label></article>`;
}
function renderSidebar() {
  let group='';
  $('list').innerHTML=filtered.map(q=>{const heading=q.category!==group?`<div class="group-label">${esc(q.category)}</div>`:'';group=q.category;return heading+`<button class="q-button ${q.id===selected?'active':''}" data-question="${q.id}"><span class="q-id">${q.id}</span><span class="q-name">${esc(q.title)}</span>${done.has(q.id)?'<span class="done-dot"></span>':''}</button>`}).join('');
  $('count').textContent=filtered.length+' / 100';
  $('progress').textContent=done.size;
}
function render() {
  renderSidebar();
  if (!filtered.length) {$('content').innerHTML='<div class="empty">没有匹配的题目，请调整搜索或筛选。</div>';$('navigation').hidden=true;return;}
  if (!filtered.some(q=>q.id===selected)) selected=filtered[0].id;
  renderSidebar();
  $('content').innerHTML=(full?filtered:[DATA.find(q=>q.id===selected)]).map(article).join('');
  $('navigation').hidden=full;
  const index=filtered.findIndex(q=>q.id===selected);
  $('previous').disabled=index<=0;
  $('next').disabled=index===filtered.length-1;
  $('mode').textContent=full?'切换单题模式':'展开全部题解';
}
function filter() {
  const keyword=$('search').value.trim().toLowerCase(),category=$('category').value,difficulty=$('difficulty').value;
  filtered=DATA.filter(q=>(!category||q.category===category)&&(!difficulty||q.difficulty===difficulty)&&(!keyword||[q.id,q.title,q.english_title,q.category,q.approach,q.code].join(' ').toLowerCase().includes(keyword)));
  render();
}
$('search').addEventListener('input',filter);
$('category').addEventListener('change',filter);
$('difficulty').addEventListener('change',filter);
$('reset').onclick=()=>{$('search').value='';$('category').value='';$('difficulty').value='';filter();};
$('mode').onclick=()=>{full=!full;render();};
$('list').onclick=e=>{const b=e.target.closest('[data-question]');if(!b)return;selected=+b.dataset.question;if(full){document.getElementById('question-'+selected)?.scrollIntoView({behavior:'smooth'});renderSidebar();}else{render();window.scrollTo({top:0,behavior:'smooth'});}};
function move(delta){const i=filtered.findIndex(q=>q.id===selected);if(filtered[i+delta]){selected=filtered[i+delta].id;render();window.scrollTo({top:0,behavior:'smooth'});}}
$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('content').addEventListener('change',e=>{if(!e.target.matches('[data-done]'))return;const id=+e.target.dataset.done;if(e.target.checked)done.add(id);else done.delete(id);try{localStorage.setItem('hot100-python3-20261008-progress',JSON.stringify([...done]));}catch(err){}renderSidebar();});
let toastTimer;
function toast(message){$('toast').textContent=message;$('toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('visible'),1800);}
$('content').addEventListener('click',async e=>{const button=e.target.closest('[data-copy]');if(!button)return;const text=DATA.find(q=>q.id===+button.dataset.copy).code;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const input=document.createElement('textarea');input.value=text;input.style.position='fixed';input.style.opacity='0';document.body.appendChild(input);input.select();const copied=document.execCommand('copy');input.remove();if(!copied)throw Error();}toast('代码已复制');}catch(err){toast('请选中代码后手动复制');}});
render();
</script></body></html>

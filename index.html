</style></head><body><header class="hero"><div class="topline"><div><div class="eyebrow">LEETCODE / TOP 100 LIKED</div><h1>热题 100 <span>· Python3</span></h1><p>题意简述 · 思路推导 · 正确性 · 完整代码 · 复杂度 · 易错点</p></div><div class="stats"><div><strong>100</strong><small>完整题单</small></div><div><strong>17</strong><small>算法分类</small></div><div><strong id="progress">0</strong><small>已掌握</small></div></div></div><p style="margin-top:14px;font-size:12px">来源：<a href="https://leetcode.cn/studyplan/top-100-liked/" target="_blank" rel="noopener">力扣官方 Hot100 学习计划</a> · 核对日期 2026-10-08 · 题意为原创简述，完整描述通过原题链接查看</p></header><div class="toolbar"><input id="search" type="search" placeholder="搜索题号、题名、算法或代码" aria-label="搜索题目"><select id="category" aria-label="算法分类"><option value="">全部分类</option></select><select id="difficulty" aria-label="题目难度"><option value="">全部难度</option><option value="EASY">简单</option><option value="MEDIUM">中等</option><option value="HARD">困难</option></select><button id="reset">重置筛选</button><button id="mode">展开全部题解</button></div><div class="layout"><aside class="sidebar"><div class="side-title">题目目录 <span id="count">100 / 100</span></div><nav id="list" aria-label="题目目录"></nav></aside><main><div id="content"></div><div class="nav" id="navigation"><button id="previous">← 上一题</button><button id="next">下一题 →</button></div></main></div><footer>100题均核对官方Python3接口。本地101项测试覆盖全部100题，包含边界与部分随机对照；未向力扣判题系统提交。链表与树题的ListNode、TreeNode、Node由平台提供，本地测试会自动注入。进度只保存在此浏览器。</footer><div id="toast" class="toast" role="status"></div><script>const DATA=[{"order": 1, "id": 1, "title": "两数之和", "english_title": "Two Sum", "slug": "two-sum", "difficulty": "EASY", "category": "哈希", "url": "https://leetcode.cn/problems/two-sum/", "summary": "在整数数组中寻找两个不同位置，使对应元素的和等于目标值，返回这两个下标。", "approach": "一次遍历，用哈希表记录已经见过的数及其下标。", "steps": ["遍历到数x时，计算还需要的数target-x。", "先在哈希表中查找这个补数；若存在，两个下标就是答案。", "查找结束后才将x和当前下标写入表中。"], "why": "表中只保存当前位置之前的元素，因此不会重复使用同一个位置。每一对可行答案都会在较晚的元素被遍历到时被发现。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "哈希查询按平均O(1)计算。", "pitfalls": ["必须先查补数再插入当前元素，尤其要正确处理两个相同的数。"], "code": "class Solution:\n    def twoSum(self, nums, target):\n        seen = {}\n        for i, x in enumerate(nums):\n            if target - x in seen:\n                return [seen[target - x], i]\n            seen[x] = i\n        return []\n"}, {"order": 2, "id": 49, "title": "字母异位词分组", "english_title": "Group Anagrams", "slug": "group-anagrams", "difficulty": "MEDIUM", "category": "哈希", "url": "https://leetcode.cn/problems/group-anagrams/", "summary": "把字符串按字母异位关系分组：同组字符串的每种字母出现次数相同。", "approach": "用26个小写字母的计数元组作为哈希键。", "steps": ["为每个单词统计a到z出现次数。", "把计数列表转换为不可变元组。", "计数元组相同的单词放入同一个列表，最后返回所有列表。"], "why": "在只含小写英文字母的题目约束下，两个字符串是异位词，当且仅当它们的26维计数相同。", "time_complexity": "O(L+26N)", "space_complexity": "O(26N+N)", "complexity_notes": "N为字符串数量，L为总字符数；保存分组中的字符串引用而非复制字符。固定26时通常写作时间O(L+N)、额外空间O(N)，包含输出。", "pitfalls": ["空字符串也需要加入分组。", "可哈希的键应使用tuple，不能使用list。"], "code": "from collections import defaultdict\n\nclass Solution:\n    def groupAnagrams(self, strs):\n        groups = defaultdict(list)\n        for word in strs:\n            counts = [0] * 26\n            for ch in word:\n                counts[ord(ch) - ord('a')] += 1\n            groups[tuple(counts)].append(word)\n        return list(groups.values())\n"}, {"order": 3, "id": 128, "title": "最长连续序列", "english_title": "Longest Consecutive Sequence", "slug": "longest-consecutive-sequence", "difficulty": "MEDIUM", "category": "哈希", "url": "https://leetcode.cn/problems/longest-consecutive-sequence/", "summary": "数组元素可以无序且重复，求能组成的最长连续整数段长度。", "approach": "哈希集合去重，只从连续段的最小值开始向右计数。", "steps": ["把所有数加入集合，忽略重复元素。", "若x-1也在集合中，则x不是一段的起点，跳过。", "从真正的起点依次查找x+1、x+2等，更新最长长度。"], "why": "每个数只会作为某段中的元素被向右计数一次；不会从每个数都重复扫描同一条连续段。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "时间为哈希操作的期望复杂度。", "pitfalls": ["必须遍历去重后的集合；重复起点会造成不必要的扫描。"], "code": "class Solution:\n    def longestConsecutive(self, nums):\n        values = set(nums)\n        best = 0\n        for x in values:\n            if x - 1 not in values:\n                y = x\n                while y in values:\n                    y += 1\n                best = max(best, y - x)\n        return best\n"}, {"order": 4, "id": 283, "title": "移动零", "english_title": "Move Zeroes", "slug": "move-zeroes", "difficulty": "EASY", "category": "双指针", "url": "https://leetcode.cn/problems/move-zeroes/", "summary": "把所有零移动到数组末尾，同时保持非零元素的原有相对顺序，直接修改原数组。", "approach": "写指针稳定压缩非零元素，再把剩余位置填零。", "steps": ["write表示下一个非零元素的写入位置。", "按原顺序扫描，遇到非零值就写到nums[write]并推进write。", "扫描完成后，把write之后的元素全部改成0。"], "why": "已写入的前缀始终是扫描过的非零元素，顺序不变；write不会超过读取位置，所以不会破坏后续待读数据。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "只使用两个下标，不创建新数组。", "pitfalls": ["要求原地修改，返回新列表不能替代修改输入。"], "code": "class Solution:\n    def moveZeroes(self, nums):\n        write = 0\n        for read in range(len(nums)):\n            if nums[read] != 0:\n                nums[write] = nums[read]\n                write += 1\n        for i in range(write, len(nums)):\n            nums[i] = 0\n"}, {"order": 5, "id": 11, "title": "盛最多水的容器", "english_title": "Container With Most Water", "slug": "container-with-most-water", "difficulty": "MEDIUM", "category": "双指针", "url": "https://leetcode.cn/problems/container-with-most-water/", "summary": "选取两条竖线与横轴构成容器，求能够容纳的最大面积。", "approach": "双指针从两端向内移动，每次移动较短的一端。", "steps": ["左右指针分别放在数组两端。", "面积等于两端较小高度乘以两端距离。", "记录当前面积，随后移动较短的一端，直到指针相遇。"], "why": "固定较短端而缩小宽度，面积上限只会降低，因此这一端当前能取得的最好候选已经检查过，可以安全舍弃。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "每个指针最多移动n次。", "pitfalls": ["高度取两端的较小值。", "移动较长的一端可能跳过更优解。"], "code": "class Solution:\n    def maxArea(self, height):\n        left, right = 0, len(height) - 1\n        best = 0\n        while left \u003c right:\n            best = max(best, min(height[left], height[right]) * (right - left))\n            if height[left] \u003c= height[right]:\n                left += 1\n            else:\n                right -= 1\n        return best\n"}, {"order": 6, "id": 15, "title": "三数之和", "english_title": "3Sum", "slug": "3sum", "difficulty": "MEDIUM", "category": "双指针", "url": "https://leetcode.cn/problems/3sum/", "summary": "找出数组中所有元素和为0的三元组，三元组之间不能重复，三个元素必须来自不同位置。", "approach": "排序后固定第一个数，剩余部分用双指针找两数之和。", "steps": ["先排序，让相同值相邻，便于去重和移动指针。", "枚举第一个数，跳过与上一次相同的值；若它大于0则结束。", "在右侧区间用左右指针调整总和，命中时记录答案并跳过两端的重复值。"], "why": "排序后，总和偏小时增加左端，总和偏大时减小右端，不会丢掉能满足目标的候选；去重保证每种数值组合只输出一次。", "time_complexity": "O(n²)", "space_complexity": "O(n+R)", "complexity_notes": "R为答案保存空间；Python原地排序可能需要O(n)辅助空间，双指针本身O(1)。", "pitfalls": ["排序会修改输入数组。", "固定值和命中后的两端值都需要去重。"], "code": "class Solution:\n    def threeSum(self, nums):\n        nums.sort()\n        answer = []\n        n = len(nums)\n        for i in range(n - 2):\n            if i and nums[i] == nums[i - 1]:\n                continue\n            if nums[i] > 0:\n                break\n            left, right = i + 1, n - 1\n            while left \u003c right:\n                total = nums[i] + nums[left] + nums[right]\n                if total \u003c 0:\n                    left += 1\n                elif total > 0:\n                    right -= 1\n                else:\n                    answer.append([nums[i], nums[left], nums[right]])\n                    x, y = nums[left], nums[right]\n                    while left \u003c right and nums[left] == x:\n                        left += 1\n                    while left \u003c right and nums[right] == y:\n                        right -= 1\n        return answer\n"}, {"order": 7, "id": 42, "title": "接雨水", "english_title": "Trapping Rain Water", "slug": "trapping-rain-water", "difficulty": "HARD", "category": "双指针", "url": "https://leetcode.cn/problems/trapping-rain-water/", "summary": "把数组看作柱子的高度，计算雨后所有凹槽能够积存的水量。", "approach": "双指针维护左右最高柱，处理最高边界较低的一侧。", "steps": ["指针从两端开始，分别更新left_max和right_max。", "若left_max不大于right_max，则左侧可积水量已经由left_max决定。", "否则处理右侧；每个位置只处理一次。"], "why": "较低的已知边界一侧，其另一侧已经存在足够高的柱子，因此该位置的水位不必等待未知区域就能确定。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "没有额外的左右最大值数组。", "pitfalls": ["水量使用历史最大高度减去当前位置高度。", "不要把当前两端高度直接当作所有位置的水位。"], "code": "class Solution:\n    def trap(self, height):\n        left, right = 0, len(height) - 1\n        left_max = right_max = 0\n        water = 0\n        while left \u003c= right:\n            left_max = max(left_max, height[left])\n            right_max = max(right_max, height[right])\n            if left_max \u003c= right_max:\n                water += left_max - height[left]\n                left += 1\n            else:\n                water += right_max - height[right]\n                right -= 1\n        return water\n"}, {"order": 8, "id": 3, "title": "无重复字符的最长子串", "english_title": "Longest Substring Without Repeating Characters", "slug": "longest-substring-without-repeating-characters", "difficulty": "MEDIUM", "category": "滑动窗口", "url": "https://leetcode.cn/problems/longest-substring-without-repeating-characters/", "summary": "求字符串中不含重复字符的最长连续子串长度。", "approach": "滑动窗口加字符最近出现位置，遇到重复时直接跳过冲突位置。", "steps": ["left是当前无重复窗口的左边界。", "若当前字符曾出现，就把left提高到它上次位置加1与原left的较大值。", "记录当前字符位置，并用right-left+1更新答案。"], "why": "left始终不会后退；跳过字符上次出现位置后，窗口内恰好不再包含该字符的重复项。", "time_complexity": "O(n)", "space_complexity": "O(min(n,Σ))", "complexity_notes": "Σ为字符集大小。", "pitfalls": ["必须取max，不能让left退回到已经排除的区间。"], "code": "class Solution:\n    def lengthOfLongestSubstring(self, s):\n        last = {}\n        left = best = 0\n        for right, ch in enumerate(s):\n            left = max(left, last.get(ch, -1) + 1)\n            last[ch] = right\n            best = max(best, right - left + 1)\n        return best\n"}, {"order": 9, "id": 438, "title": "找到字符串中所有字母异位词", "english_title": "Find All Anagrams in a String", "slug": "find-all-anagrams-in-a-string", "difficulty": "MEDIUM", "category": "滑动窗口", "url": "https://leetcode.cn/problems/find-all-anagrams-in-a-string/", "summary": "在字符串s中找出所有与字符串p互为字母异位词的连续子串，返回它们的起始位置。", "approach": "维护长度固定为len(p)的窗口与26维字母计数。", "steps": ["统计p的字母计数。", "右端加入新字符；当窗口超过p的长度时，移除最左侧字符。", "窗口长度达到p的长度且计数相等时，记录左端下标。"], "why": "固定长度窗口覆盖全部候选子串，计数相等准确刻画了异位词条件。", "time_complexity": "O(|s|+|p|)", "space_complexity": "O(1)+O(R)", "complexity_notes": "26维比较为常数；R为答案数量。", "pitfalls": ["p比s长时答案为空。", "这里是固定长度窗口，不能随意收缩成较短窗口。"], "code": "class Solution:\n    def findAnagrams(self, s, p):\n        width = len(p)\n        if width > len(s):\n            return []\n        need, window = [0] * 26, [0] * 26\n        for ch in p:\n            need[ord(ch) - ord('a')] += 1\n        answer = []\n        for right, ch in enumerate(s):\n            window[ord(ch) - ord('a')] += 1\n            if right >= width:\n                window[ord(s[right - width]) - ord('a')] -= 1\n            if right + 1 >= width and window == need:\n                answer.append(right - width + 1)\n        return answer\n"}, {"order": 10, "id": 560, "title": "和为 K 的子数组", "english_title": "Subarray Sum Equals K", "slug": "subarray-sum-equals-k", "difficulty": "MEDIUM", "category": "子串", "url": "https://leetcode.cn/problems/subarray-sum-equals-k/", "summary": "求数组中元素和恰好为k的连续非空子数组数量；数组可以包含负数。", "approach": "前缀和加哈希计数：当前前缀为s时，统计此前前缀s-k出现的次数。", "steps": ["把前缀和0的出现次数初始化为1，表示空前缀。", "逐个累加当前前缀和s，答案增加count[s-k]。", "随后再把当前前缀s的次数加1。"], "why": "区间和等于两个前缀之差；每个以当前位置结束的合法子数组，都对应一个此前出现的前缀s-k。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "哈希操作按平均O(1)计算。", "pitfalls": ["负数使普通滑动窗口不再适用。", "先查询后记录当前前缀，避免计入空区间。"], "code": "from collections import defaultdict\n\nclass Solution:\n    def subarraySum(self, nums, k):\n        counts = defaultdict(int)\n        counts[0] = 1\n        prefix = answer = 0\n        for x in nums:\n            prefix += x\n            answer += counts[prefix - k]\n            counts[prefix] += 1\n        return answer\n"}, {"order": 11, "id": 239, "title": "滑动窗口最大值", "english_title": "Sliding Window Maximum" e(s):\n            if need[ch] > 0:\n                missing -= 1\n            need[ch] -= 1\n            while missing == 0:\n                if right - left + 1 \u003c best_len:\n                    best_start, best_len = left, right - left + 1\n                old = s[left]\n                need[old] += 1\n                if need[old] > 0:\n                    missing += 1\n                left += 1\n        return '' if best_len > len(s) else s[best_start:best_start + best_len]\n"}, {"order": 13, "id": 53, "title": "最大子数组和", "english_title": "Maximum Subarray", "slug": "maximum-subarray", "difficulty": "MEDIUM", "category": "普通数组", "url": "https://leetcode.cn/problems/maximum-subarray/", "summary": "求非空连续子数组能够取得的最大元素和。", "approach": "Kadane动态规划：决定当前元素是接到前一段后面，还是重新开始。", "steps": ["ending表示必须以当前元素结尾的最佳和。", "转移为max(x, ending+x)。", "同时维护所有ending中的最大值。"], "why": "以当前位置结尾的子数组只有两种选择：只包含当前值，或接续以前一位置结尾的子数组；取其中最佳即可。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "只保留前一状态与全局最佳值。", "pitfalls": ["答案和初始状态应取nums[0]，不能设为0，否则全负数时会出错。"], "code": "class Solution:\n    def maxSubArray(self, nums):\n        ending = best = nums[0]\n        for i in range(1, len(nums)):\n            ending = max(nums[i], ending + nums[i])\n            best = max(best, ending)\n        return best\n"}, {"order": 14, "id": 56, "title": "合并区间", "english_title": "Merge Intervals", "slug": "merge-intervals", "difficulty": "MEDIUM", "category": "普通数组", "url": "https://leetcode.cn/problems/merge-intervals/", "summary": "合并所有互相重叠的闭区间，返回合并后的区间集合。", "approach": "按左端排序，然后把新区间并入当前最后一段或新建一段。", "steps": ["按区间左端从小到大排序。", "如果新区间左端大于当前段右端，则不存在重叠，开始新段。", "否则将当前段右端更新为两个右端的较大值。"], "why": "排序后，当前段左边的区间已经处理完；新区间只能与最后一段重叠，不可能越过它与更早的独立段重叠。", "time_complexity": "O(n log n)", "space_complexity": "O(n)", "complexity_notes": "Python排序辅助空间及结果空间均为O(n)。", "pitfalls": ["闭区间端点相等也算重叠。", "复制写入的区间，避免结果中的修改意外影响原区间元素。"], "code": "class Solution:\n    def merge(self, intervals):\n        intervals.sort(key=lambda item: item[0])\n        answer = []\n        for left, right in intervals:\n            if not answer or left > answer[-1][1]:\n                answer.append([left, right])\n            else:\n                answer[-1][1] = max(answer[-1][1], right)\n        return answer\n"}, {"order": 15, "id": 189, "title": "轮转数组", "english_title": "Rotate Array", "slug": "rotate-array", "difficulty": "MEDIUM", "category": "普通数组", "url": "https://leetcode.cn/problems/rotate-array/", "summary": "把数组循环向右移动k步，直接修改原数组。", "approach": "三次原地翻转：整体、前k段、剩余段。", "steps": ["先令k对数组长度取模，处理超过一整圈的移动。", "翻转整个数组。", "分别翻转前k个元素与剩余元素，恢复各段内部顺序。"], "why": "整体翻转把原尾部k个元素搬到了前面，但段内顺序相反；再翻转两段即可得到目标顺序。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "使用手动交换翻转，不用切片创建新列表。", "pitfalls": ["不要用nums=...替代原地修改。", "k必须对数组长度取模，空数组单独处理。"], "code": "class Solution:\n    def rotate(self, nums, k):\n        n = len(nums)\n        if n == 0:\n            return\n        k %= n\n        def reverse(left, right):\n            while left \u003c right:\n                nums[left], nums[right] = nums[right], nums[left]\n                left += 1\n                right -= 1\n        reverse(0, n - 1)\n        reverse(0, k - 1)\n        reverse(k, n - 1)\n"}, {"order": 16, "id": 238, "title": "除了自身以外数组的乘积", "english_title": "Product of Array Except Self", "slug": "product-of-array-except-self", "difficulty": "MEDIUM", "category": "普通数组", "url": "https://leetcode.cn/problems/product-of-array-except-self/", "summary": "返回新数组，其中位置i的值是输入数组中除nums[i]之外所有元素的乘积，不能使用除法。", "approach": "先写前缀乘积，再用一个后缀乘积变量补齐。", "steps": ["第一遍令answer[i]等于i左侧全部元素的乘积。", "第二遍从右向左维护右侧元素乘积suffix。", "answer[i]乘以suffix后，再把当前元素加入suffix。"], "why": "一个元素之外的全部位置恰好分成其左侧前缀与右侧后缀，两者相乘就是答案。", "time_complexity": "O(n)", "space_complexity": "O(1)辅助；O(n)输出", "complexity_notes": "答案数组不计入辅助空间；不使用额外的前后缀数组。", "pitfalls": ["更新suffix前先写当前位置的答案。", "该方法无需特殊判断0，也能正确处理多个0。"], "code": "class Solution:\n    def productExceptSelf(self, nums):\n        answer = [1] * len(nums)\n        prefix = 1\n        for i, x in enumerate(nums):\n            answer[i] = prefix\n            prefix *= x\n        suffix = 1\n        for i in range(len(nums) - 1, -1, -1):\n            answer[i] *= suffix\n            suffix *= nums[i]\n        return answer\n"}, {"order": 17, "id": 41, "title": "缺失的第一个正数", "english_title": "First Missing Positive", "slug": "first-missing-positive", "difficulty": "HARD", "category": "普通数组", "url": "https://leetcode.cn/problems/first-missing-positive/", "summary": "在未排序整数数组中找出最小的缺失正整数，要求线性时间和常数额外空间。", "approach": "原地归位：值x若在1到n范围内，应放到下标x-1。", "steps": ["遍历每个位置，把范围合法且尚未归位的值交换到它应在的位置。", "交换后继续处理刚换来的值，直到当前位置无法再归位。", "再次扫描，首个nums[i]不等于i+1的位置对应答案；全部正确则返回n+1。"], "why": "每次有效交换都会把至少一个合法数放到最终位置；如果1到n中的某个数存在，归位后它必然在自己的位置上。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "每个有效交换至少增加一个已归位位置，总交换次数为O(n)。", "pitfalls": ["交换前检查目标位置是否已经有相同值，防止重复值导致死循环。", "算法会修改输入数组。"], "code": "class Solution:\n    def firstMissingPositive(self, nums):\n        n = len(nums)\n        for i in range(n):\n            while 1 \u003c= nums[i] \u003c= n and nums[nums[i] - 1] != nums[i]:\n                j = nums[i] - 1\n                nums[i], nums[j] = nums[j], nums[i]\n        for i, x in enumerate(nums):\n            if x != i + 1:\n                return i + 1\n        return n + 1\n"}, {"order": 18, "id": 73, "title": "矩阵置零", "english_title": "Set Matrix Zeroes", "slug": "set-matrix-zeroes", "difficulty": "MEDIUM", "category": "矩阵", "url": "https://leetcode.cn/problems/set-matrix-zeroes/", "summary": "矩阵中原本为0的元素会使它所在的整行、整列变为0，要求原地修改矩阵。", "approach": "借用第一行与第一列记录待清零的列和行。", "steps": ["先单独记录第一行和第一列原本是否包含0。", "扫描其余元素，用matrix[i][0]、matrix[0][j]标记要清零的行列。", "依据标记清零内部区域，最后根据两个布尔值处理第一行与第一列。"], "why": "标记完整保存了原始零元素影响的行列；在标记完成之前不修改内部元素，可避免新产生的0继续错误传播。", "time_complexity": "O(mn)", "space_complexity": "O(1)", "complexity_notes": "仅使用两个布尔变量，行列标记存放在输入矩阵中。", "pitfalls": ["不能在发现0时立即把整行整列清零。", "第一行和第一列要最后处理，否则会破坏标记。"], "code": "class Solution:\n    def setZeroes(self, matrix):\n        if not matrix or not matrix[0]:\n            return\n        m, n = len(matrix), len(matrix[0])\n        first_row = any(matrix[0][j] == 0 for j in range(n))\n        first_col = any(matrix[i][0] == 0 for i in range(m))\n        for i in range(1, m):\n            for j in range(1, n):\n                if matrix[i][j] == 0:\n                    matrix[i][0] = matrix[0][j] = 0\n        for i in range(1, m):\n            for j in range(1, n):\n                if matrix[i][0] == 0 or matrix[0][j] == 0:\n                    matrix[i][j] = 0\n        if first_row:\n            for j in range(n):\n                matrix[0][j] = 0\n        if first_col:\n            for i in range(m):\n                matrix[i][0] = 0\n"}, {"order": 19, "id": 54, "title": "螺旋矩阵", "english_title": "Spiral Matrix", "slug": "spiral-matrix", "difficulty": "MEDIUM", "category": "矩阵", "url": "https://leetcode.cn/problems/spiral-matrix/", "summary": "按顺时针方向逐层读取矩阵元素，返回螺旋顺序。", "approach": "维护上、下、左、右四条边界，读完一条边就收缩它。", "steps": ["依次读取上边从左到右、右边从上到下。", "若仍有剩余行，再读取下边从右到左。", "若仍有剩余列，再读取左边从下到上；持续缩小边界。"], "why": "每次读取都是当前未访问矩形的一条外边，读完立即排除，直到矩形消失，因此每个元素恰好读取一次。", "time_complexity": "O(mn)", "space_complexity": "O(1)辅助；O(mn)输出", "complexity_notes": "四个边界只需要常数空间。", "pitfalls": ["单行或单列在收缩边界后可能已读完，必须再次检查。"], "code": "class Solution:\n    def spiralOrder(self, matrix):\n        if not matrix or not matrix[0]:\n            return []\n        top, bottom = 0, len(matrix) - 1\n        left, right = 0, len(matrix[0]) - 1\n        answer = []\n        while top \u003c= bottom and left \u003c= right:\n            for j in range(left, right + 1):\n                answer.append(matrix[top][j])\n            top += 1\n            for i in range(top, bottom + 1):\n                answer.append(matrix[i][right])\n            right -= 1\n            if top \u003c= bottom:\n                for j in range(right, left - 1, -1):\n                    answer.append(matrix[bottom][j])\n                bottom -= 1\n            if left \u003c= right:\n                for i in range(bottom, top - 1, -1):\n                    answer.append(matrix[i][left])\n                left += 1\n        return answer\n"}, {"order": 20, "id": 48, "title": "旋转图像", "english_title": "Rotate Image", "slug": "rotate-image", "difficulty": "MEDIUM", "category": "矩阵", "url": "https://leetcode.cn/problems/rotate-image/", "summary": "将n×n方阵顺时针旋转90度，直接修改原矩阵。", "approach": "先沿主对角线转置，再反转每一行。", "steps": ["交换主对角线上下的元素matrix[i][j]与matrix[j][i]。", "逐行调用reverse。", "两步组合后，原来的(i,j)会移动到(j,n-1-i)。"], "why": "转置把坐标变为(j,i)，反转行把它变为(j,n-1-i)，正好是顺时针90度旋转的坐标映射。", "time_complexity": "O(n²)", "space_complexity": "O(1)", "complexity_notes": "list.reverse原地操作，不产生额外矩阵。", "pitfalls": ["转置只遍历对角线的一侧，避免交换两次。", "本题输入必须是方阵。"], "code": "class Solution:\n    def rotate(self, matrix):\n        n = len(matrix)\n        for i in range(n):\n            for j in range(i + 1, n):\n                matrix[i][j], matrix[j][i] = matrix[j][i], matrix[i][j]\n        for row in matrix:\n            row.reverse()\n"}, {"order": 21, "id": 240, "title": "搜索二维矩阵 II", "english_title": "Search a 2D Matrix II", "slug": "search-a-2d-matrix-ii", "difficulty": "MEDIUM", "category": "矩阵", "url": "https://leetcode.cn/problems/search-a-2d-matrix-ii/", "summary": "矩阵的每行从左到右、每列从上到下均递增，判断目标值是否存在。", "approach": "从右上角出发，根据比较结果排除整行或整列。", "steps": ["当前值等于target时返回True。", "当前值太大时，所在列下方只会更大，因此向左移动。", "当前值太小时，所在行左侧只会更小，因此向下移动。"], "why": "每一步都排除一个不可能含有目标值的完整行或列，且剩余矩形仍保持行列递增性质。", "time_complexity": "O(m+n)", "space_complexity": "O(1)", "complexity_notes": "指针最多左移n次、下移m次。", "pitfalls": ["此题不同于74题：不能把整个矩阵直接当作一维有序数组二分。"], "code": "class Solution:\n    def searchMatrix(self, matrix, target):\n        if not matrix or not matrix[0]:\n            return False\n        row, col = 0, len(matrix[0]) - 1\n        while row \u003c len(matrix) and col >= 0:\n            current = matrix[row][col]\n            if current == target:\n                return True\n            if current > target:\n                col -= 1\n            else:\n                row += 1\n        return False\n"}, {"order": 22, "id": 160, "title": "相交链表", "english_title": "Intersection of Two Linked Lists", "slug": "intersection-of-two-linked-lists", "difficulty": "EASY", "category": "链表", "url": "https://leetcode.cn/problems/intersection-of-two-linked-lists/", "summary": "给定两条无环单链表，找出它们共享的第一个节点；没有共享节点时返回 None。", "approach": "两个指针分别走完 A→B 和 B→A，抵消不相交前缀的长度差。", "steps": ["分别从两条链表的头节点出发。", "指针走到 None 时，下一步改从另一条链表的头出发。", "两个指针指向同一个对象时停止，该对象就是交点或 None。"], "why": "每个指针最多走过两条链表的长度之和。有交点时，两段独立前缀在第二轮被抵消，两个指针同时进入共享后缀；无交点时，它们同时到达 None。", "time_complexity": "O(m + n)", "space_complexity": "O(1)", "complexity_notes": "m、n 为两条链表的长度；比较的是节点对象身份。", "pitfalls": ["值相等不代表节点相交，必须比较对象身份。", "本题链表无环，不能直接套用于有环链表。"], "code": "class Solution:\n    def getIntersectionNode(self, headA, headB):\n        a, b = headA, headB\n        while a is not b:\n            a = a.next if a is not None else headB\n            b = b.next if b is not None else headA\n        return a\n"}, {"order": 23, "id": 206, "title": "反转链表", "english_title": "Reverse Linked List", "slug": "reverse-linked-list", "difficulty": "EASY", "category": "链表", "url": "https://leetcode.cn/problems/reverse-linked-list/", "summary": "调整单链表的 next 指针，使节点顺序完全反转，并返回新的头节点。", "approach": "逐个把当前节点接到已经反转好的前缀前面。", "steps": ["用 prev 表示反转后前缀的头，初始为 None。", "在修改 curr.next 之前保存原来的后继。", "把 curr.next 指向 prev，再推进 prev 和 curr。"], "why": "循环开始时，prev 指向已经正确反转的前缀，curr 指向尚未处理的后缀。每轮把一个节点移入前缀，且保留通往后缀的指针，直到后缀为空。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "原地修改 next 指针，不新建结果节点。", "pitfalls": ["必须先保存后继，否则修改 next 后会丢失剩余链表。"], "code": "class Solution:\n    def reverseList(self, head):\n        prev, curr = None, head\n        while curr is not None:\n            nxt = curr.next\n            curr.next = prev\n            prev, curr = curr, nxt\n        return prev\n"}, {"order": 24, "id": 234, "title": "回文链表", "english_title": "Palindrome Linked List", "slug": "palindrome-linked-list", "difficulty": "EASY", "category": "链表", "url": "https://leetcode.cn/problems/palindrome-linked-list/", "summary": "判断链表的节点值从前往后与从后往前是否完全一致。", "approach": "快慢指针定位前半段末尾，反转后半段进行比较，再恢复链表。", "steps": ["快指针每次走两步，慢指针每次走一步，找到前半段最后一个节点。", "反转慢指针之后的后半段。", "从原头节点和反转后的后半段同步比较。", "不论比较结果如何，都再次反转后半段并接回原位置。"], "why": "反转后的后半段按原链表的逆序排列，因此对应位置相等恰好等价于回文。奇数长度的中间节点无需比较。恢复操作只改变指针，不影响判断结果。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "后半段反转两次仍为线性时间；函数返回后保留原链表结构。", "pitfalls": ["发现不匹配后也要恢复链表，不能直接提前返回。", "奇数长度时不要把中间节点计入后半段。"], "code": "class Solution:\n    def isPalindrome(self, head):\n        if head is None or head.next is None:\n            return True\n\n        def reverse(node):\n            prev = None\n            while node is not None:\n                nxt = node.next\n                node.next = prev\n                prev, node = node, nxt\n            return prev\n\n        slow = fast = head\n        while fast.next is not None and fast.next.next is not None:\n            slow = slow.next\n            fast = fast.next.next\n\n        second = reverse(slow.next)\n        left, right = head, second\n        valid = True\n        while right is not None:\n            if left.val != right.val:\n                valid = False\n                break\n            left, right = left.next, right.next\n\n        slow.next = reverse(second)  # 无论结果如何，都恢复原链表。\n        return valid\n"}, {"order": 25, "id": 141, "title": "环形链表", "english_title": "Linked List Cycle", "slug": "linked-list-cycle", "difficulty": "EASY", "category": "链表", "url": "https://leetcode.cn/problems/linked-list-cycle/", "summary": "判断沿 next 指针向后行走是否会再次访问同一个节点。", "approach": "使用一快一慢两个指针，检测它们是否在环内相遇。", "steps": ["两个指针从头节点出发。", "慢指针每次前进一格，快指针前进两格。", "相遇说明有环；快指针到达尾部说明无环。"], "why": "无环时快指针最终到达 None。有环时两个指针进入环后，相对距离每轮变化一格，因此在一个环长以内必然相遇。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为不同节点的数量。", "pitfalls": ["移动快指针前需要同时确认 fast 和 fast.next 非空。", "初始两个指针相等不能直接判定有环，必须至少移动一次。"], "code": "class Solution:\n    def hasCycle(self, head):\n        slow = fast = head\n        while fast is not None and fast.next is not None:\n            slow = slow.next\n            fast = fast.next.next\n            if slow is fast:\n                return True\n        return False\n"}, {"order": 26, "id": 142, "title": "环形链表 II", "english_title": "Linked List Cycle II", "slug": "linked-list-cycle-ii", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/linked-list-cycle-ii/", "summary": "若链表存在环，返回第一次进入环的节点；无环时返回 None。", "approach": "先用快慢指针找到环内相遇点，再让头节点指针与相遇指针等速移动。", "steps": ["使用 Floyd 快慢指针寻找相遇点。", "没有相遇便返回 None。", "让一个指针回到头节点，另一个保持在相遇点。", "两者每次各走一步，再次相遇的位置即为环入口。"], "why": "设入口前长度为 a，环长为 L，入口到相遇点的环内距离为 b。相遇时慢指针的路程满足 a+b 为 L 的整数倍，因此从相遇点再走 a 步恰好到入口，从头也恰好走 a 步到入口。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "n 为不同节点的数量，两阶段均为线性行走。", "pitfalls": ["入口与快慢指针第一次相遇的位置通常不同。", "比较节点身份，不比较节点值。"], "code": "class Solution:\n    def detectCycle(self, head):\n        slow = fast = head\n        while fast is not None and fast.next is not None:\n            slow = slow.next\n            fast = fast.next.next\n            if slow is fast:\n                entry = head\n                while entry is not slow:\n                    entry = entry.next\n                    slow = slow.next\n                return entry\n        return None\n"}, {"order": 27, "id": 21, "title": "合并两个有序链表", "english_title": "Merge Two Sorted Lists", "slug": "merge-two-sorted-lists", "difficulty": "EASY", "category": "链表", "url": "https://leetcode.cn/problems/merge-two-sorted-lists/", "summary": "把两条按值升序排列的链表合并成一条升序链表。", "approach": "始终选择两个未合并头节点中值较小的一个，接到结果尾部。", "steps": ["设置哑节点和尾指针，统一处理结果头节点。", "只要两条链表都非空，就取较小头节点并推进相应链表。", "把尚未耗尽的整段链表接到尾部。"], "why": "两条链表当前头节点分别是各自剩余部分的最小值，二者的较小者必然是全体剩余节点的最小值。逐次选择即可保证结果有序且不漏节点。", "time_complexity": "O(m + n)", "space_complexity": "O(1)", "complexity_notes": "复用输入节点，仅额外分配一个哑节点；会改变输入链表连接关系。", "pitfalls": ["移动输入指针后也要移动结果尾指针。", "输入为空时仍应直接返回另一条链表。"], "code": "class Solution:\n    def mergeTwoLists(self, list1, list2):\n        dummy = ListNode()\n        tail = dummy\n        while list1 is not None and list2 is not None:\n            if list1.val \u003c= list2.val:\n                tail.next = list1\n                list1 = list1.next\n            else:\n                tail.next = list2\n                list2 = list2.next\n            tail = tail.next\n        tail.next = list1 if list1 is not None else list2\n        return dummy.next\n"}, {"order": 28, "id": 2, "title": "两数相加", "english_title": "Add Two Numbers", "slug": "add-two-numbers", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/add-two-numbers/", "summary": "两条链表按低位在前存储非负整数，返回它们相加后的同格式链表。", "approach": "模拟十进制竖式加法，逐位累加并保存进位。", "steps": ["设置 carry=0，使用哑节点构建新链表。", "取两条链表当前数字，缺失的一侧视为 0。", "用 divmod(total, 10) 得到新进位和当前位。", "直到两条链表和进位都处理完。"], "why": "在第 i 轮，carry 恰好是前 i 位相加向当前位传递的进位。当前位取 total 的个位，向下一位传递十位，逐位遵循十进制加法规则。", "time_complexity": "O(max(m, n))", "space_complexity": "O(1) 辅助空间；O(max(m, n)) 结果空间", "complexity_notes": "最多额外产生一个最高位节点；输入链表不修改。", "pitfalls": ["循环条件必须包含最后的进位，例如 9+1 需要两个结果节点。", "链表低位在前，不必先反转链表。"], "code": "class Solution:\n    def addTwoNumbers(self, l1, l2):\n        dummy = ListNode()\n        tail = dummy\n        carry = 0\n        while l1 is not None or l2 is not None or carry:\n            total = carry\n            if l1 is not None:\n                total += l1.val\n                l1 = l1.next\n            if l2 is not None:\n                total += l2.val\n                l2 = l2.next\n            carry, digit = divmod(total, 10)\n            tail.next = ListNode(digit)\n            tail = tail.next\n        return dummy.next\n"}, {"order": 29, "id": 19, "title": "删除链表的倒数第 N 个结点", "english_title": "Remove Nth Node From End of List", "slug": "remove-nth-node-from-end-of-list", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/remove-nth-node-from-end-of-list/", "summary": "删除单链表中从尾部数第 n 个节点，并返回新的头节点。", "approach": "借助哑节点，让快慢指针维持 n 个节点的间隔。", "steps": ["哑节点指向 head，快慢指针都从哑节点出发。", "先让 fast 前进 n 步。", "随后同步前进，直到 fast 指向最后一个节点。", "此时 slow 是待删除节点的前驱，跳过 slow.next。"], "why": "同步行走期间 fast 始终领先 slow 恰好 n 条边。当 fast 到达末节点，slow 后面的节点便是倒数第 n 个；哑节点使删除头节点也遵循同一操作。", "time_complexity": "O(length)", "space_complexity": "O(1)", "complexity_notes": "题目保证 1≤n≤链表长度；这里不增加无效 n 的额外约定。", "pitfalls": ["同步前进的条件是 fast.next 非空，以便 slow 停在前驱。", "删除头节点时应返回 dummy.next，而非原 head。"], "code": "class Solution:\n    def removeNthFromEnd(self, head, n):\n        dummy = ListNode(0, head)\n        fast = slow = dummy\n        for _ in range(n):\n            fast = fast.next\n        while fast.next is not None:\n            fast, slow = fast.next, slow.next\n        slow.next = slow.next.next\n        return dummy.next\n"}, {"order": 30, "id": 24, "title": "两两交换链表中的节点", "english_title": "Swap Nodes in Pairs", "slug": "swap-nodes-in-pairs", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/swap-nodes-in-pairs/", "summary": "按相邻两节点一组交换链表的连接关系，落单的最后一个节点保持不动。", "approach": "使用每组前驱，原地重接前驱→第二节点→第一节点→后续节点。", "steps": ["哑节点作为第一组的前驱。", "确认当前组存在两个节点，再保存 first 和 second。", "按 first.next、second.next、前驱 next 的顺序重连。", "第一节点成为组尾，继续处理下一组。"], "why": "每次只改动一组的三条连接，组内节点交换且与未处理后缀保持连接。前驱指针始终停在已处理部分的最后节点，互不重叠地处理全部完整组。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "交换节点本身，不交换节点的 val。", "pitfalls": ["必须保存组内两个节点，避免重接后丢失引用。", "奇数长度的最后一个节点不要修改。"], "code": "class Solution:\n    def swapPairs(self, head):\n        dummy = ListNode(0, head)\n        prev = dummy\n        while prev.next is not None and prev.next.next is not None:\n            first = prev.next\n            second = first.next\n            first.next = second.next\n            second.next = first\n            prev.next = second\n            prev = first\n        return dummy.next\n"}, {"order": 31, "id": 25, "title": "K 个一组翻转链表", "english_title": "Reverse Nodes in k-Group", "slug": "reverse-nodes-in-k-group", "difficulty": "HARD", "category": "链表", "url": "https://leetcode.cn/problems/reverse-nodes-in-k-group/", "summary": "每 k 个相邻节点构成一组并原地反转，不足 k 个的最后一组保持原顺序。", "approach": "先检查一组是否完整，再用后继边界作为反转初始前驱。", "steps": ["从 group_prev 向后走 k 步，定位 kth；不足 k 步时直接结束。", "保存这一组之后的 group_next。", "把这 k 个节点反转，初始 prev=group_next，从而自动接好后缀。", "让组前驱接到 kth，再让旧组头成为下一组前驱。"], "why": "只有完整的 k 节点组会被修改。反转过程中 prev 指向已反转部分且最终尾部接着 group_next；反转完成后 kth 是新组头，旧组头是新组尾，前后连接都得到保留。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "每个完整组被检查一次、反转一次；节点访问总次数仍为线性。", "pitfalls": ["剩余不足 k 个时必须保持原样。", "比较 curr 和 group_next 时使用节点身份，不能依靠值。"], "code": "class Solution:\n    def reverseKGroup(self, head, k):\n        dummy = ListNode(0, head)\n        group_prev = dummy\n        while True:\n            kth = group_prev\n            for _ in range(k):\n                kth = kth.next\n                if kth is None:\n                    return dummy.next\n            group_next = kth.next\n            old_first = group_prev.next\n            prev, curr = group_next, old_first\n            while curr is not group_next:\n                nxt = curr.next\n                curr.next = prev\n                prev, curr = curr, nxt\n            group_prev.next = kth\n            group_prev = old_first\n"}, {"order": 32, "id": 138, "title": "随机链表的复制", "english_title": "Copy List with Random Pointer", "slug": "copy-list-with-random-pointer", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/copy-list-with-random-pointer/", "summary": "深拷贝带 next 和 random 指针的链表，所有复制节点必须独立于原链表。", "approach": "先建立原节点到复制节点的映射，再复制两种指针关系。", "steps": ["沿 next 遍历，为每个原节点建立一个仅带值的新节点。", "第二次遍历，用映射找到原 next 和 random 的复制目标。", "设置复制节点的两种指针，最后返回复制头节点。"], "why": "每个原节点唯一对应一个新节点，因此原链表中的任意指向关系都能通过映射转换为相同的新节点关系。复制节点只指向复制节点，确保深拷贝且不修改原结构。", "time_complexity": "O(n)", "space_complexity": "O(n) 辅助空间；O(n) 结果空间", "complexity_notes": "字典保存 n 个映射；Node、next 和 random 由平台提供。", "pitfalls": ["random 可能指向自身或前面的节点，因此不能只在单次前向遍历中连接未创建目标。", "不能把原 random 节点直接接到复制链表。"], "code": "class Solution:\n    def copyRandomList(self, head):\n        copies = {}\n        curr = head\n        while curr is not None:\n            copies[curr] = Node(curr.val)\n            curr = curr.next\n        curr = head\n        while curr is not None:\n            copies[curr].next = copies.get(curr.next)\n            copies[curr].random = copies.get(curr.random)\n            curr = curr.next\n        return copies.get(head)\n"}, {"order": 33, "id": 148, "title": "排序链表", "english_title": "Sort List", "slug": "sort-list", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/sort-list/", "summary": "按节点值对单链表进行升序排序，返回排序后的头节点。", "approach": "使用归并排序：拆成两半，递归排序，再原地归并。", "steps": ["空链表或单节点已经有序，直接返回。", "快慢指针找中点，并断开左右两半。", "递归排序两半。", "用双指针按值选择节点，将两条有序链表合并。"], "why": "每次拆分后两半均严格变短；递归假设保证两半有序。归并每次选取剩余最小节点，得到包含全部节点的有序结果。", "time_complexity": "O(n log n)", "space_complexity": "O(log n)", "complexity_notes": "每层归并总工作量 O(n)，递归深度 O(log n)。这里采用自顶向下递归版本，不满足进阶要求的 O(1) 辅助空间；可改用自底向上归并。", "pitfalls": ["拆分后要把 slow.next 置为 None，避免两段仍连接而无限递归。", "fast 从 head.next 出发，才能正确拆分两个节点。"], "code": "class Solution:\n    def sortList(self, head):\n        if head is None or head.next is None:\n            return head\n        slow, fast = head, head.next\n        while fast is not None and fast.next is not None:\n            slow = slow.next\n            fast = fast.next.next\n        right = slow.next\n        slow.next = None\n        left = self.sortList(head)\n        right = self.sortList(right)\n        dummy = ListNode()\n        tail = dummy\n        while left is not None and right is not None:\n            if left.val \u003c= right.val:\n                tail.next, left = left, left.next\n            else:\n                tail.next, right = right, right.next\n            tail = tail.next\n        tail.next = left if left is not None else right\n        return dummy.next\n"}, {"order": 34, "id": 23, "title": "合并 K 个升序链表", "english_title": "Merge k Sorted Lists", "slug": "merge-k-sorted-lists", "difficulty": "HARD", "category": "链表", "url": "https://leetcode.cn/problems/merge-k-sorted-lists/", "summary": "把多条升序链表合并成一条包含全部节点的升序链表。", "approach": "用最小堆保存每条非空链表当前的头节点。", "steps": ["将非空链表头以 (值, 链表编号, 节点) 形式加入堆。", "弹出最小值节点并接到结果尾部。", "若该节点还有后继，就把同一链表的后继入堆。", "堆空时所有节点均已合并，返回结果。"], "why": "堆中每个节点都是其所属链表剩余部分的最小值，堆顶因而是全体尚未合并节点的最小值。弹出并补充后继维护这一不变量，结果始终升序。", "time_complexity": "O(k + N log(k + 1))", "space_complexity": "O(k)", "complexity_notes": "k为输入链表数量，N为总节点数。构造初始堆先扫描k条链表，heapify为O(k)；之后逐节点堆操作为O(N log(k+1))。辅助堆最多存k个节点，不创建新的结果节点。", "pitfalls": ["节点值相等时，堆不能直接比较 ListNode，需要唯一且可比较的链表编号。", "同一链表在堆中最多保留一个节点，才能用固定编号安全破平局。"], "code": "from heapq import heapify, heappop, heappush\n\nclass Solution:\n    def mergeKLists(self, lists):\n        heap = [(node.val, i, node)\n                for i, node in enumerate(lists) if node is not None]\n        heapify(heap)\n        dummy = ListNode()\n        tail = dummy\n        while heap:\n            _, i, node = heappop(heap)\n            nxt = node.next\n            tail.next = node\n            tail = node\n            if nxt is not None:\n                heappush(heap, (nxt.val, i, nxt))\n        tail.next = None\n        return dummy.next\n"}, {"order": 35, "id": 146, "title": "LRU 缓存", "english_title": "LRU Cache", "slug": "lru-cache", "difficulty": "MEDIUM", "category": "链表", "url": "https://leetcode.cn/problems/lru-cache/", "summary": "设计有限容量缓存：读取和更新都将条目标记为最近使用，容量满时淘汰最久未使用条目。", "approach": "使用 OrderedDict 同时维护键值映射和从最旧到最新的使用顺序。", "steps": ["缓存按从左到右的顺序保存最久到最近使用的条目。", "get 命中时把该键移动到末尾，并返回值。", "put 写入或覆盖键后也把它移动到末尾。", "超出容量时弹出最左边的条目。"], "why": "每次命中的 get 和每次 put 都将所访问键移到末尾，其余键相对顺序保持不变，因此最左边一直是最久未使用键，淘汰规则正确。", "time_complexity": "get、put 均为平均 O(1)", "space_complexity": "O(capacity)", "complexity_notes": "OrderedDict 是 Python 标准库中支持顺序移动与两端删除的映射；哈希查询使用平均复杂度。", "pitfalls": ["更新已有键也属于使用操作，必须刷新顺序。", "get 未命中时返回 -1，不能改变其他键顺序。"], "code": "from collections import OrderedDict\n\nclass LRUCache:\n    def __init__(self, capacity: int):\n        self.capacity = capacity\n        self.cache = OrderedDict()\n\n    def get(self, key: int) -> int:\n        if key not in self.cache:\n            return -1\n        self.cache.move_to_end(key)\n        return self.cache[key]\n\n    def put(self, key: int, value: int) -> None:\n        self.cache[key] = value\n        self.cache.move_to_end(key)\n        if len(self.cache) > self.capacity:\n            self.cache.popitem(last=False)\n"}, {"order": 36, "id": 94, "title": "二叉树的中序遍历", "english_title": "Binary Tree Inorder Traversal", "slug": "binary-tree-inorder-traversal", "difficulty": "EASY", "category": "二叉树", "url": "https://leetcode.cn/problems/binary-tree-inorder-traversal/", "summary": "按照左子树、当前节点、右子树的顺序，返回二叉树的节点值。", "approach": "使用显式栈记录尚未访问的祖先，模拟中序递归。", "steps": ["从当前节点沿左孩子不断入栈。", "到达空节点时弹出栈顶并访问其值。", "转向该节点的右孩子，重复上述过程。"], "why": "栈顶是当前应访问的最深未访问祖先，其左子树已处理完；访问后转向右子树，因此整个访问顺序严格符合左、根、右。", "time_complexity": "O(n)", "space_complexity": "O(h) 辅助空间；O(n) 结果空间", "complexity_notes": "h 为树高。显式栈避免 Python 深树递归深度限制。", "pitfalls": ["外层循环必须是当前节点非空或栈非空，而非只检查其中一个。"], "code": "class Solution:\n    def inorderTraversal(self, root):\n        result, stack = [], []\n        curr = root\n        while curr is not None or stack:\n            while curr is not None:\n                stack.append(curr)\n                curr = curr.left\n            curr = stack.pop()\n            result.append(curr.val)\n            curr = curr.right\n        return result\n"}, {"order": 37, "id": 104, "title": "二叉树的最大深度", "english_title": "Maximum Depth of Binary Tree", "slug": "maximum-depth-of-binary-tree", "difficulty": "EASY", "category": "二叉树", "url": "https://leetcode.cn/problems/maximum-depth-of-binary-tree/", "summary": "返回二叉树从根到叶子的最长路径包含的节点数，空树深度为 0。", "approach": "显式深度优先遍历，在栈中携带每个节点的深度。", "steps": ["非空根节点以深度 1 入栈。", "弹出一个节点，用其深度更新最大值。", "将非空孩子以深度加 1 入栈。"], "why": "根节点深度正确，每条父子边都使深度增加 1，因此所有节点记录的深度都正确。最大节点深度即最长根到叶路径长度。", "time_complexity": "O(n)", "space_complexity": "O(h)", "complexity_notes": "显式 DFS 栈的大小由树高控制；空树不分配节点栈。", "pitfalls": ["深度按节点数计算，根节点从 1 开始。"], "code": "class Solution:\n    def maxDepth(self, root):\n        if root is None:\n            return 0\n        answer = 0\n        stack = [(root, 1)]\n        while stack:\n            node, depth = stack.pop()\n            answer = max(answer, depth)\n            if node.left is not None:\n                stack.append((node.left, depth + 1))\n            if node.right is not None:\n                stack.append((node.right, depth + 1))\n        return answer\n"}, {"order": 38, "id": 226, "title": "翻转二叉树", "english_title": "Invert Binary Tree", "slug": "invert-binary-tree", "difficulty": "EASY", "category": "二叉树", "url": "https://leetcode.cn/problems/invert-binary-tree/", "summary": "交换二叉树中每个节点的左右孩子，返回翻转后的根节点。", "approach": "用显式栈遍历所有节点，对每个节点交换 left 和 right。", "steps": ["空树直接返回。", "弹出节点并交换它的两个孩子。", "把交换后的非空孩子加入栈，直到所有节点都处理过。"], "why": "整棵树的镜像等价于每个节点左右子树都互换。遍历会恰好处理每个节点一次，局部交换覆盖所有连接，从而得到整体镜像。", "time_complexity": "O(n)", "space_complexity": "O(h)", "complexity_notes": "原地修改树；辅助空间为显式 DFS 栈。", "pitfalls": ["只交换根的孩子还不够，所有节点都要交换。"], "code": "class Solution:\n    def invertTree(self, root):\n        if root is None:\n            return None\n        stack = [root]\n        while stack:\n            node = stack.pop()\n            node.left, node.right = node.right, node.left\n            if node.left is not None:\n                stack.append(node.left)\n            if node.right is not None:\n                stack.append(node.right)\n        return root\n"}, {"order": 39, "id": 101, "title": "对称二叉树", "english_title": "Symmetric Tree", "slug": "symmetric-tree", "difficulty": "EASY", "category": "二叉树", "url": "https://leetcode.cn/problems/symmetric-tree/", "summary": "判断二叉树是否关于根节点左右镜像对称。", "approach": "成对比较镜像位置的节点，再配对它们的外侧和内侧孩子。", "steps": ["空树视为对称；将根的左右孩子成对入队。", "两个节点都为空则跳过，只有一个为空或值不同则返回 False。", "继续比较 (左.left, 右.right) 和 (左.right, 右.left)。"], "why": "镜像要求对应根值相等、外侧子树互为镜像、内侧子树互为镜像。队列逐层检查所有这些条件，无失败即满足整体镜像定义。", "time_complexity": "O(n)", "space_complexity": "O(w)", "complexity_notes": "w 为树的最大层宽；队列保留镜像节点对。", "pitfalls": ["镜像比较是交叉配对，不能比较两个 left 或两个 right。", "仅比较每层的值列表可能遗漏结构差异。"], "code": "from collections import deque\n\nclass Solution:\n    def isSymmetric(self, root):\n        if root is None:\n            return True\n        queue = deque([(root.left, root.right)])\n        while queue:\n            left, right = queue.popleft()\n            if left is None and right is None:\n                continue\n            if left is None or right is None or left.val != right.val:\n                return False\n            queue.append((left.left, right.right))\n            queue.append((left.right, right.left))\n        return True\n"}, {"order": 40, "id": 543, "title": "二叉树的直径", "english_title": "Diameter of Binary Tree", "slug": "diameter-of-binary-tree", "difficulty": "EASY", "category": "二叉树", "url": "https://leetcode.cn/problems/diameter-of-binary-tree/", "summary": "求二叉树任意两节点之间最长路径的边数，该路径不必经过根节点。", "approach": "后序计算每个节点的子树高度，并用左高加右高更新全局直径。", "steps": ["用带完成标记的栈进行后序遍历。", "首次遇到节点时先安排其孩子处理。", "再次遇到节点时读取左右高度，更新 left_height+right_height。", "保存当前节点高度为 max(左右高度)+1。"], "why": "每条最长路径有唯一最高节点；以该节点为转折点，最长可用路径就是左子树最高分支与右子树最高分支之和。对所有节点取最大值覆盖全部可能路径。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "高度字典保存每个节点结果，另有 O(h) 遍历栈；采用迭代方式避免深树递归溢出。直径按边数而高度按节点数计。", "pitfalls": ["直径是左右高度相加，不是左右高度最大值。", "答案需要全局更新，最长路径可能完全处于某个子树内。"], "code": "class Solution:\n    def diameterOfBinaryTree(self, root):\n        if root is None:\n            return 0\n        height = {}\n        answer = 0\n        stack = [(root, False)]\n        while stack:\n            node, done = stack.pop()\n            if not done:\n                stack.append((node, True))\n                if node.right is not None:\n                    stack.append((node.right, False))\n                if node.left is not None:\n                    stack.append((node.left, False))\n            else:\n                left = height.get(node.left, 0)\n                right = height.get(node.right, 0)\n                answer = max(answer, left + right)\n                height[node] = max(left, right) + 1\n        return answer\n"}, {"order": 41, "id": 102, "title": "二叉树的层序遍历", "english_title": "Binary Tree Level Order Traversal", "slug": "binary-tree-level-order-traversal", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/binary-tree-level-order-traversal/", "summary": "按从上到下、每层从左到右的顺序，返回二叉树的分层节点值列表。", "approach": "广度优先遍历，并在每轮开始时固定本层队列长度。", "steps": ["根节点入队，空树返回空列表。", "记录当前队列长度，只弹出这么多个节点作为本层。", "依次记录值，将非空左右孩子按左后右的顺序入队。", "本层结束后把本层列表加入结果。"], "why": "每轮开始时队列恰好包含下一层节点，固定长度防止刚加入的孩子被同轮处理。按左右顺序入队使每层访问顺序也从左到右。", "time_complexity": "O(n)", "space_complexity": "O(w) 辅助空间；O(n) 结果空间", "complexity_notes": "w 为最大层宽，层结果属于输出空间。", "pitfalls": ["内层循环不能使用不断变化的队列长度。", "Python 队列应使用 deque.popleft，避免列表 pop(0) 的搬移成本。"], "code": "from collections import deque\n\nclass Solution:\n    def levelOrder(self, root):\n        if root is None:\n            return []\n        queue = deque([root])\n        result = []\n        while queue:\n            level = []\n            for _ in range(len(queue)):\n                node = queue.popleft()\n                level.append(node.val)\n                if node.left is not None:\n                    queue.append(node.left)\n                if node.right is not None:\n                    queue.append(node.right)\n            result.append(level)\n        return result\n"}, {"order": 42, "id": 108, "title": "将有序数组转换为二叉搜索树", "english_title": "Convert Sorted Array to Binary Search Tree", "slug": "convert-sorted-array-to-binary-search-tree", "difficulty": "EASY", "category": "二叉树", "url": "https://leetcode.cn/problems/convert-sorted-array-to-binary-search-tree/", "summary": "把严格升序数组转换成高度平衡的二叉搜索树，允许返回任意满足条件的结构。", "approach": "每个区间选择中间元素为根，将左右子区间分别构建为子树。", "steps": ["从数组完整闭区间开始，用栈保存区间与待连接的父节点位置。", "非空区间取中点，新建节点并连接到父节点。", "把中点右侧和左侧的区间入栈，空区间无需创建节点。"], "why": "中点左侧元素全小于根，右侧元素全大于根，因此满足二叉搜索树性质。每次两侧元素数量至多相差 1，递归式区间划分使整棵树高度平衡。", "time_complexity": "O(n)", "space_complexity": "O(log n) 辅助空间；O(n) 结果空间", "complexity_notes": "使用区间下标而不切片复制；显式栈模拟平衡构建过程。", "pitfalls": ["不要把数组切片当作 O(1) 操作；大量切片会增加复制开销。", "结果树不唯一，测试应验证中序序列和高度平衡，而非固定结构。"], "code": "class Solution:\n    def sortedArrayToBST(self, nums):\n        if not nums:\n            return None\n        dummy = TreeNode()\n        stack = [(0, len(nums) - 1, dummy, True)]\n        while stack:\n            lo, hi, parent, is_left = stack.pop()\n            if lo > hi:\n                continue\n            mid = (lo + hi) // 2\n            node = TreeNode(nums[mid])\n            if is_left:\n                parent.left = node\n            else:\n                parent.right = node\n            stack.append((mid + 1, hi, node, False))\n            stack.append((lo, mid - 1, node, True))\n        return dummy.left\n"}, {"order": 43, "id": 98, "title": "验证二叉搜索树", "english_title": "Validate Binary Search Tree", "slug": "validate-binary-search-tree", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/validate-binary-search-tree/", "summary": "判断整棵二叉树是否满足每个节点左侧所有后代严格更小、右侧所有后代严格更大的搜索树规则。", "approach": "深度优先遍历时传递严格上下界，检查节点是否位于允许区间。", "steps": ["根节点初始区间是负无穷到正无穷。", "弹出节点时检查 lower\u003cval\u003cupper。", "左孩子继承下界并把上界收紧到当前值；右孩子反之。"], "why": "祖先施加的全部大小限制都可合并为一个严格区间。每个节点通过检查意味着它满足所有祖先方向限制，而不仅是直接父子关系，因此整棵树满足搜索树定义。", "time_complexity": "O(n)", "space_complexity": "O(h)", "complexity_notes": "显式 DFS 栈保存节点与上下界；空树视为合法搜索树。", "pitfalls": ["不能只比较父节点和两个直接孩子。", "搜索树要求严格不等，重复值应判为无效。"], "code": "class Solution:\n    def isValidBST(self, root):\n        if root is None:\n            return True\n        stack = [(root, float('-inf'), float('inf'))]\n        while stack:\n            node, lower, upper = stack.pop()\n            if not lower \u003c node.val \u003c upper:\n                return False\n            if node.left is not None:\n                stack.append((node.left, lower, node.val))\n            if node.right is not None:\n                stack.append((node.right, node.val, upper))\n        return True\n"}, {"order": 44, "id": 230, "title": "二叉搜索树中第 K 小的元素", "english_title": "Kth Smallest Element in a BST", "slug": "kth-smallest-element-in-a-bst", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/kth-smallest-element-in-a-bst/", "summary": "在合法二叉搜索树中，返回按值升序排列的第 k 个节点值。", "approach": "中序遍历得到升序访问次序，只需访问到第 k 个节点便停止。", "steps": ["使用显式栈把当前节点的所有左侧祖先压入栈。", "弹出节点时令 k 减 1，若变成 0 则返回该值。", "进入右子树继续中序遍历。"], "why": "搜索树的中序节点值严格升序，所以第 k 次访问的节点恰好是第 k 小。提前停止不影响已访问序列的排序性质。", "time_complexity": "O(h + k)，最坏 O(n)", "space_complexity": "O(h)", "complexity_notes": "h 为树高；题目保证树非空且 1≤k≤节点数。", "pitfalls": ["k 在真正访问节点时递减，不是在入栈时递减。", "退化搜索树的 h 可等于 n，不能无条件写 O(log n)。"], "code": "class Solution:\n    def kthSmallest(self, root, k):\n        stack = []\n        curr = root\n        while curr is not None or stack:\n            while curr is not None:\n                stack.append(curr)\n                curr = curr.left\n            curr = stack.pop()\n            k -= 1\n            if k == 0:\n                return curr.val\n            curr = curr.right\n"}, {"order": 45, "id": 199, "title": "二叉树的右视图", "english_title": "Binary Tree Right Side View", "slug": "binary-tree-right-side-view", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/binary-tree-right-side-view/", "summary": "从二叉树右侧观察，返回每一层最右边可见节点的值。", "approach": "按左到右做层序遍历，保存每层最后一个节点。", "steps": ["根节点入队。", "固定本层队列长度，按左后右入队孩子。", "本层最后一次弹出的节点加入答案。"], "why": "层序遍历的每层队列按从左到右排列，因此最后弹出的节点就是该层最右节点，即从右侧能看到的节点。", "time_complexity": "O(n)", "space_complexity": "O(w) 辅助空间；O(h) 结果空间", "complexity_notes": "w 为最大层宽；每层产生一个结果。右视图并不等于一直沿右孩子走。", "pitfalls": ["某层没有右分支时，左子树的节点仍可能出现在右视图中。"], "code": "from collections import deque\n\nclass Solution:\n    def rightSideView(self, root):\n        if root is None:\n            return []\n        queue = deque([root])\n        result = []\n        while queue:\n            size = len(queue)\n            for i in range(size):\n                node = queue.popleft()\n                if i == size - 1:\n                    result.append(node.val)\n                if node.left is not None:\n                    queue.append(node.left)\n                if node.right is not None:\n                    queue.append(node.right)\n        return result\n"}, {"order": 46, "id": 114, "title": "二叉树展开为链表", "english_title": "Flatten Binary Tree to Linked List", "slug": "flatten-binary-tree-to-linked-list", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/flatten-binary-tree-to-linked-list/", "summary": "原地把二叉树展开为仅通过 right 相连的链，节点顺序与原树前序遍历相同，全部 left 置空。", "approach": "存在左子树时，将原右子树接到左子树最右节点，再把左子树整体移到右侧。", "steps": ["从根开始沿当前 right 向下处理。", "若存在左子树，找到该左子树沿 right 走到的最右节点。", "把原右子树接到这个节点的 right。", "将左子树移到当前 right，并清空当前 left，然后继续向右。"], "why": "前序顺序是当前节点、左子树、右子树。把右子树接在左子树的右边界之后，再把左子树移到右侧，保留这一顺序；继续处理左子树内部即可最终得到完整前序链。", "time_complexity": "O(n)", "space_complexity": "O(1)", "complexity_notes": "虽然包含寻找右边界的内层循环，但各右边界链的原有边总共被扫描线性次；不使用节点数组或递归栈。", "pitfalls": ["必须先保存并接回原右子树，否则会丢失节点。", "题目要求原地修改并返回 None，不新建链表节点。"], "code": "class Solution:\n    def flatten(self, root) -> None:\n        curr = root\n        while curr is not None:\n            if curr.left is not None:\n                predecessor = curr.left\n                while predecessor.right is not None:\n                    predecessor = predecessor.right\n                predecessor.right = curr.right\n                curr.right = curr.left\n                curr.left = None\n            curr = curr.right\n"}, {"order": 47, "id": 105, "title": "从前序与中序遍历序列构造二叉树", "english_title": "Construct Binary Tree from Preorder and Inorder Traversal", "slug": "construct-binary-tree-from-preorder-and-inorder-traversal", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/construct-binary-tree-from-preorder-and-inorder-traversal/", "summary": "给定同一棵树的前序和中序遍历，节点值互不相同，恢复其二叉树结构。", "approach": "按前序逐个创建节点，用栈和中序游标决定连接为左孩子还是右孩子。", "steps": ["前序首值是根，根入栈；游标指向中序首值。", "若栈顶值尚未等于中序游标值，新节点是栈顶的左孩子。", "否则连续弹出已经完成左子树的祖先，并同步推进中序游标。", "新节点是最后弹出祖先的右孩子，然后将它入栈。"], "why": "前序决定节点创建顺序，而中序指出某个节点左子树何时已遍历完。匹配并弹栈恰好完成应回退的祖先；下一前序节点应接在最后完成祖先的右侧，或在未完成栈顶的左侧。", "time_complexity": "O(n)", "space_complexity": "O(h) 辅助空间；O(n) 结果空间", "complexity_notes": "每个节点入栈、出栈至多一次；无需切片或额外下标表，且避免退化树递归深度问题。输入保证遍历有效且节点值唯一。", "pitfalls": ["重复值时不能仅靠值决定弹栈，本题明确保证值唯一。", "弹栈时可能连续完成多个祖先，要使用 while 而不是 if。"], "code": "class Solution:\n    def buildTree(self, preorder, inorder):\n        if not preorder:\n            return None\n        root = TreeNode(preorder[0])\n        stack = [root]\n        index = 0\n        for position in range(1, len(preorder)):\n            node = TreeNode(preorder[position])\n            if stack[-1].val != inorder[index]:\n                stack[-1].left = node\n            else:\n                parent = None\n                while stack and stack[-1].val == inorder[index]:\n                    parent = stack.pop()\n                    index += 1\n                parent.right = node\n            stack.append(node)\n        return root\n"}, {"order": 48, "id": 437, "title": "路径总和 III", "english_title": "Path Sum III", "slug": "path-sum-iii", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/path-sum-iii/", "summary": "统计二叉树中和等于 targetSum 的向下连续路径数量，路径可从任意节点开始。", "approach": "DFS 维护当前祖先路径上的前缀和频次，以差值查询所有合法起点。", "steps": ["初始前缀表加入 {0:1}，表示根之前的空路径。", "进入节点时更新当前前缀和，先查询 current-targetSum 的出现次数。", "把当前前缀加入表，再遍历孩子。", "离开节点时减少该前缀频次并删除零频次键，避免污染其他分支。"], "why": "当前前缀和减去某个祖先之前的前缀和，等于该祖先之后到当前节点的路径和。表只包含当前祖先链上的前缀，差值查询恰好统计所有向下合法路径；退出时回溯保证不同分支不能拼接。", "time_complexity": "平均 O(n)", "space_complexity": "O(h)", "complexity_notes": "字典查询按平均 O(1) 计算；进入/退出事件的显式 DFS 栈和有效前缀表都为 O(h)，避免深树递归溢出。", "pitfalls": ["必须先查询再加入当前前缀，否则 targetSum=0 会把空路径算进去。", "离开节点必须回溯清除前缀，否则可能把兄弟分支拼成不存在的路径。", "节点可能为负数，不能用只适用于正数的滑动窗口。"], "code": "class Solution:\n    def pathSum(self, root, targetSum):\n        if root is None:\n            return 0\n        prefix_count = {0: 1}\n        answer = 0\n        stack = [(root, 0, False)]\n        while stack:\n            node, prefix, exiting = stack.pop()\n            if exiting:\n                prefix_count[prefix] -= 1\n                if prefix_count[prefix] == 0:\n                    del prefix_count[prefix]\n                continue\n            current = prefix + node.val\n            answer += prefix_count.get(current - targetSum, 0)\n            prefix_count[current] = prefix_count.get(current, 0) + 1\n            stack.append((node, current, True))\n            if node.right is not None:\n                stack.append((node.right, current, False))\n            if node.left is not None:\n                stack.append((node.left, current, False))\n        return answer\n"}, {"order": 49, "id": 236, "title": "二叉树的最近公共祖先", "english_title": "Lowest Common Ancestor of a Binary Tree", "slug": "lowest-common-ancestor-of-a-binary-tree", "difficulty": "MEDIUM", "category": "二叉树", "url": "https://leetcode.cn/problems/lowest-common-ancestor-of-a-binary-tree/", "summary": "返回给定二叉树中两个指定节点的最近公共祖先，节点本身也可以是祖先。", "approach": "先建立父节点映射，再从一个节点记录祖先链，从另一个节点向上找第一次相交。", "steps": ["DFS 记录每个已发现节点的父节点，直到两个目标都已发现。", "从 p 向上行走，把 p 及其所有祖先放入集合。", "从 q 向上行走，第一个属于集合的节点即是答案。"], "why": "集合包含 p 的全部祖先。从 q 向上遇到的第一个共同祖先，是距离 q 最近的共同祖先；其任何更低后代都不同时覆盖两节点，因此就是最近公共祖先。", "time_complexity": "平均 O(n)", "space_complexity": "O(n)", "complexity_notes": "父节点字典最多保存 n 个节点，祖先集合为 O(h)。题目保证 p、q 均存在；使用节点身份，不用值代替对象。", "pitfalls": ["p 本身可能是 q 的祖先，祖先集合应包含 p。", "这里是普通二叉树，不能使用二叉搜索树按值分支的规则。"], "code": "class Solution:\n    def lowestCommonAncestor(self, root, p, q):\n        if root is None:\n            return None\n        parents = {root: None}\n        stack = [root]\n        while p not in parents or q not in parents:\n            node = stack.pop()\n            if node.left is not None:\n                parents[node.left] = node\n                stack.append(node.left)\n            if node.right is not None:\n                parents[node.right] = node\n                stack.append(node.right)\n        ancestors = set()\n        curr = p\n        while curr is not None:\n            ancestors.add(curr)\n            curr = parents[curr]\n        curr = q\n        while curr not in ancestors:\n            curr = parents[curr]\n        return curr\n"}, {"order": 50, "id": 124, "title": "二叉树中的最大路径和", "english_title": "Binary Tree Maximum Path Sum", "slug": "binary-tree-maximum-path-sum", "difficulty": "HARD", "category": "二叉树", "url": "https://leetcode.cn/problems/binary-tree-maximum-path-sum/", "summary": "在非空二叉树中选择一条不重复节点的连续路径，使节点值总和最大，路径不要求经过根。", "approach": "后序计算可向父节点延伸的单侧最大贡献，同时尝试在当前节点连接左右两侧。", "steps": ["用显式后序遍历保证孩子贡献已计算。", "把负的子树贡献截断为 0，表示不选择该分支。", "用 node.val+left_gain+right_gain 更新全局答案。", "向父节点只传 node.val+max(left_gain,right_gain)，不把双侧路径向上延伸。"], "why": "每条路径有一个最高节点，它的两侧至多各连接一条下降路径。全局更新覆盖所有最高节点；向父节点只能传一条分支，否则节点会产生三叉而不再是一条路径。负贡献舍弃不会降低总和。", "time_complexity": "O(n)", "space_complexity": "O(n)", "complexity_notes": "贡献字典保存各节点结果，另有 O(h) 后序栈；非空树答案初始化为负无穷，支持全负数。", "pitfalls": ["全负数时不能把答案初始化为 0，路径必须至少包含一个节点。", "向父节点返回单侧贡献，全局候选才允许加左右两侧。"], "code": "class Solution:\n    def maxPathSum(self, root):\n        best = float('-inf')\n        gains = {}\n        stack = [(root, False)]\n        while stack:\n            node, done = stack.pop()\n            if not done:\n                stack.append((node, True))\n                if node.right is not None:\n                    stack.append((node.right, False))\n                if node.left is not None:\n                    stack.append((node.left, False))\n            else:\n                left = max(0, gains.get(node.left, 0))\n                right = max(0, gains.get(node.right, 0))\n                best = max(best, node.val + left + right)\n                gains[node] = node.val + max(left, right)\n        return best\n"}, {"order": 51, "id": 200, "title": "岛屿数量", "english_title": "Number of Islands", "slug": "number-of-islands", "difficulty": "MEDIUM", "category": "图论", "url": "https://leetcode.cn/problems/number-of-islands/", "summary": "统计字符网格中由上下左右相邻的陆地形成的连通块数量。", "approach": "扫描网格，遇到尚未处理的陆地就计数一次，并用迭代 DFS 标记整个连通块。", "steps": ["只从字符 '1' 出发；每个新的起点代表一座尚未计数的岛。", "把起点改为 '0' 后入栈，避免重复加入。", "逐个弹出格子，检查四个方向，把相邻陆地立即标记后入栈。", "遍历结束，起点出现的次数就是岛屿数量。"], "why": "一次搜索恰好访问起点所在的整个陆地连通块；该连通块全部被标记后，不会再次成为起点，因此每座岛只计数一次。", "time_complexity": "O(mn)", "space_complexity": "O(mn)", "complexity_notes": "m、n 为行列数。栈在最坏情况下保存 O(mn) 个位置；原地修改输入网格。迭代实现避免大岛触发 Python 递归深度限制。", "pitfalls": ["网格元素是字符串 '1'/'0'，不是整数。", "应在入栈时标记，防止同一个格子被重复加入。", "不计算对角相邻。"], "code": "from typing import List\n\nclass Solution:\n    def numIslands(self, grid: List[List[str]]) -> int:\n        if not grid or not grid[0]:\n            return 0\n        m, n = len(grid), len(grid[0])\n        answer = 0\n        for r in range(m):\n            for c in range(n):\n                if grid[r][c] != \"1\":\n                    continue\n                answer += 1\n                grid[r][c] = \"0\"\n                stack = [(r, c)]\n                while stack:\n                    x, y = stack.pop()\n                    for dx, dy in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                        nx, ny = x + dx, y + dy\n                        if 0 \u003c= nx \u003c m and 0 \u003c= ny \u003c n and grid[nx][ny] == \"1\":\n                            grid[nx][ny] = \"0\"\n                            stack.append((nx, ny))\n        return answer\n"}, {"order": 52, "id": 994, "title": "腐烂的橘子", "english_title": "Rotting Oranges", "slug": "rotting-oranges", "difficulty": "MEDIUM", "category": "图论", "url": "https://leetcode.cn/problems/rotting-oranges/", "summary": "多个腐烂橘子同时传播腐烂，求所有新鲜橘子被感染的最短分钟数；无法全部感染时返回 -1。", "approach": "以所有初始腐烂橘子为起点做多源 BFS，每一层对应一分钟。", "steps": ["扫描网格，把所有腐烂橘子加入队列，并统计新鲜橘子数量。", "每轮只处理队列当前这一层，让相邻新鲜橘子变腐烂并加入下一层。", "每感染一个新鲜橘子就减少计数；处理一层后时间增加一分钟。", "没有新鲜橘子时返回用时；队列耗尽仍有新鲜橘子则返回 -1。"], "why": "BFS 按到初始腐烂集合的最短距离分层；第 t 层对应首次能在第 t 分钟腐烂的格子，所以得到最短时间。", "time_complexity": "O(mn)", "space_complexity": "O(mn)", "complexity_notes": "每个橘子最多入队一次；队列最多保存 O(mn) 个格子。代码原地更新网格。", "pitfalls": ["没有新鲜橘子时答案是 0。", "初始所有腐烂橘子必须同时入队，不能逐个独立传播。", "按层记录时间，避免给每一个橘子单独加一分钟。"], "code": "from collections import deque\nfrom typing import List\n\nclass Solution:\n    def orangesRotting(self, grid: List[List[int]]) -> int:\n        if not grid or not grid[0]:\n            return 0\n        m, n = len(grid), len(grid[0])\n        queue = deque()\n        fresh = 0\n        for r in range(m):\n            for c in range(n):\n                if grid[r][c] == 2:\n                    queue.append((r, c))\n                elif grid[r][c] == 1:\n                    fresh += 1\n        minutes = 0\n        while queue and fresh:\n            for _ in range(len(queue)):\n                r, c = queue.popleft()\n                for dr, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):\n                    nr, nc = r + dr, c + dc\n                    if 0 \u003c= nr \u003c m and 0 \u003c= nc \u003c n and grid[nr][nc] == 1:\n                        grid[nr][nc] = 2\n                        fresh -= 1\n                        queue.append((nr, nc))\n            minutes += 1\n        return minutes if fresh == 0 else -1\n"}, {"order": 53, "id": 207, "title": "课程表", "english_title": "Course Schedule", "slug": "course-schedule", "difficulty": "MEDIUM", "category": "图论", "url": "https://leetcode.cn/problems/course-schedule/", "summary": "给定课程的先修依赖关系，判断能否安排一个顺序修完全部课程。", "approach": "将先修关系建成有向图，用入度队列进行拓扑排序，检查是否处理了全部节点。", "steps": ["对于 [course, pre]，建立 pre 到 course 的边，并增加 course 的入度。", "把所有入度为 0 的课程加入队列。", "弹出一门课程视为学完，减少它所有后续课程的入度；归零时入队。", "处理数等于课程总数说明无环；否则剩余依赖中存在环。"], "why": "入度为 0 的节点没有未完成的前置条件，可以安全删除。有向无环图总能找到这样的节点；有环时环上的节点无法全部归零。", "time_complexity": "O(V + E)", "space_complexity": "O(V + E)", "complexity_notes": "V 为课程数，E 为先修关系数；邻接表、入度数组和队列占用 O(V + E)。", "pitfalls": ["注意边的方向是先修课程指向后续课程。", "没有依赖的课程也必须计入总处理数。", "只要有一个环就无法修完全部课程。"], "code": "from collections import deque\nfrom typing import List\n\nclass Solution:\n    def canFinish(self, numCourses: int, prerequisites: List[List[int]]) -> bool:\n        graph = [[] for _ in range(numCourses)]\n        indegree = [0] * numCourses\n        for course, pre in prerequisites:\n            graph[pre].append(course)\n            indegree[course] += 1\n        queue = deque(i for i, degree in enumerate(indegree) if degree == 0)\n        completed = 0\n        while queue:\n            pre = queue.popleft()\n            completed += 1\n            for course in graph[pre]:\n                indegree[course] -= 1\n                if indegree[course] == 0:\n                    queue.append(course)\n        return completed == numCourses\n"}, {"order": 54, "id": 208, "title": "实现 Trie (前缀树)", "english_title": "Implement Trie (Prefix Tree)", "slug": "implement-trie-prefix-tree", "difficulty": "MEDIUM", "category": "图论", "url": "https://leetcode.cn/problems/implement-trie-prefix-tree/", "summary": "实现前缀树，支持插入单词、查询完整单词以及判断某个前缀是否存在。", "approach": "每个节点保存字符到子节点的字典，另用结束标记区分单词与普通前缀。", "steps": ["插入时逐字符向下走，不存在的边就新建节点。", "全部字符插入后，只在末节点设置单词结束标记。", "查询时沿字符路径查找，任何一步不存在都失败。", "完整词查询还要检查结束标记；前缀查询只需要路径存在。"], "why": "根到节点的路径唯一代表一个前缀；插入保留全部单词路径，结束标记恰好记录已插入的完整词，因此两类查询不会混淆。", "time_complexity": "每次操作 O(L)", "space_complexity": "总存储 O(S)；单次查询辅助空间 O(1)", "complexity_notes": "L 为本次单词或前缀长度，S 为全部插入单词的字符总数；共享前缀通常使实际节点数更小。字典操作按平均 O(1) 计算。", "pitfalls": ["路径存在不代表完整单词已插入。", "重复插入应保持相同查询结果。"], "code": "class _TrieNode:\n    def __init__(self):\n        self.children = {}\n        self.is_word = False\n\nclass Trie:\n    def __init__(self):\n        self.root = _TrieNode()\n\n    def insert(self, word: str) -> None:\n        node = self.root\n        for ch in word:\n            if ch not in node.children:\n                node.children[ch] = _TrieNode()\n            node = node.children[ch]\n        node.is_word = True\n\n    def _find(self, text: str):\n        node = self.root\n        for ch in text:\n            if ch not in node.children:\n                return None\n            node = node.children[ch]\n        return node\n\n    def search(self, word: str) -> bool:\n        node = self._find(word)\n        return node is not None and node.is_word\n\n    def startsWith(self, prefix: str) -> bool:\n        return self._find(prefix) is not None\n"}, {"order": 55, "id": 46, "title": "全排列", "english_title": "Permutations", "slug": "permutations", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/permutations/", "summary": "列出互不相同的整数数组的全部排列。", "approach": "逐个确定排列位置，用 used 数组记录当前路径已经使用的下标，递归后撤销选择。", "steps": ["维护当前排列 path 和已使用标记 used。", "每一层枚举所有未使用的下标，选择一个元素放入当前位置。", "长度达到 n 时复制 path 加入答案。", "返回上一层后弹出元素并恢复 used，探索其他候选。"], "why": "每条根到叶的路径恰好选择每个下标一次，构成合法排列；每个合法排列按自己的元素顺序对应唯一一条路径，所以不重不漏。", "time_complexity": "O(n · n!)", "space_complexity": "O(n)，不含输出", "complexity_notes": "结果有 n! 个排列，复制每个排列需 O(n)；完整结果存储 O(n · n!)。递归深度、路径和 used 均为 O(n)。", "pitfalls": ["加入答案必须复制 path，不能直接保存同一个可变列表。", "本题输入无重复值，若有重复值需要额外去重策略。"], "code": "from typing import List\n\nclass Solution:\n    def permute(self, nums: List[int]) -> List[List[int]]:\n        answer, path = [], []\n        used = [False] * len(nums)\n        def dfs():\n            if len(path) == len(nums):\n                answer.append(path.copy())\n                return\n            for i, value in enumerate(nums):\n                if used[i]:\n                    continue\n                used[i] = True\n                path.append(value)\n                dfs()\n                path.pop()\n                used[i] = False\n        dfs()\n        return answer\n"}, {"order": 56, "id": 78, "title": "子集", "english_title": "Subsets", "slug": "subsets", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/subsets/", "summary": "返回互不相同整数数组的全部子集，包含空集。", "approach": "用递增下标的回溯路径代表子集，每进入一个节点就记录当前路径。", "steps": ["先记录空路径，对应空集。", "从 start 开始枚举下一次选取的下标。", "选取下标 i 后递归到 i + 1，保证路径下标严格递增。", "撤销本次选取后继续枚举，每个组合只出现一次。"], "why": "每个子集都有唯一的升序下标表示；回溯恰好生成所有这些下标序列，因此覆盖所有子集且不会生成不同排列的重复结果。", "time_complexity": "O(n · 2^n)", "space_complexity": "O(n)，不含输出", "complexity_notes": "有 2^n 个子集，所有复制元素的总数为 n·2^(n-1)（n≥1）；输出占 O(n·2^n)，递归路径占 O(n)。", "pitfalls": ["每一层都要记录路径，而不只是最深层。", "下一层从 i + 1 开始，不能反复使用同一下标。"], "code": "from typing import List\n\nclass Solution:\n    def subsets(self, nums: List[int]) -> List[List[int]]:\n        answer, path = [], []\n        def dfs(start):\n            answer.append(path.copy())\n            for i in range(start, len(nums)):\n                path.append(nums[i])\n                dfs(i + 1)\n                path.pop()\n        dfs(0)\n        return answer\n"}, {"order": 57, "id": 17, "title": "电话号码的字母组合", "english_title": "Letter Combinations of a Phone Number", "slug": "letter-combinations-of-a-phone-number", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/letter-combinations-of-a-phone-number/", "summary": "按照电话键盘上数字 2–9 的字母映射，列出输入数字串可以对应的所有字母组合。", "approach": "每层对应一位数字，枚举该数字的字母并回溯，生成各位置候选集合的笛卡尔积。", "steps": ["空数字串直接返回空列表。", "建立数字到字母字符串的映射。", "在第 i 层从 digits[i] 对应的字母中选择一个，递归处理下一位。", "处理完全部数字后连接路径，得到一个完整组合。"], "why": "每个输出在每一位恰好选择一个合法字母；所有位置的候选都被枚举，且不同选择序列产生不同字符串。", "time_complexity": "O(d · 4^d)", "space_complexity": "O(d)，不含输出", "complexity_notes": "d 为数字串长度，是以所有数字都含 4 个字母计算的上界；精确输出数 P 为各位候选数的乘积，时间 O(dP)、输出空间 O(dP)。", "pitfalls": ["输入为空时应返回 []，不是 ['']。", "数字 7 和 9 各对应四个字母。"], "code": "from typing import List\n\nclass Solution:\n    def letterCombinations(self, digits: str) -> List[str]:\n        if not digits:\n            return []\n        letters = {\"2\": \"abc\", \"3\": \"def\", \"4\": \"ghi\", \"5\": \"jkl\",\n                   \"6\": \"mno\", \"7\": \"pqrs\", \"8\": \"tuv\", \"9\": \"wxyz\"}\n        answer, path = [], []\n        def dfs(i):\n            if i == len(digits):\n                answer.append(\"\".join(path))\n                return\n            for ch in letters[digits[i]]:\n                path.append(ch)\n                dfs(i + 1)\n                path.pop()\n        dfs(0)\n        return answer\n"}, {"order": 58, "id": 39, "title": "组合总和", "english_title": "Combination Sum", "slug": "combination-sum", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/combination-sum/", "summary": "从互不相同的正整数候选中选取若干数，使和等于目标；每个数可重复使用，同一组合只输出一次。", "approach": "排序后以非递减候选下标回溯，用剩余目标剪枝，重复选取时仍从当前下标开始。", "steps": ["排序候选，使超过剩余目标时可以直接结束循环。", "状态保存 start、剩余值 remain 和当前组合。", "选取 candidates[i] 后递归 dfs(i, remain - value)，允许继续使用同一个数。", "remain 为 0 时复制路径；回退后恢复路径继续搜索。"], "why": "正整数保证每次选择都缩小剩余目标；非递减下标为每个组合提供唯一表示。超过剩余目标的数及后续更大值都不能出现在有效解中，剪枝不会丢失解。", "time_complexity": "O(n log n + nV + RD)", "space_complexity": "O(n + D)，不含输出", "complexity_notes": "n 为候选数，D=floor(target/min(candidates)) 是最大路径长度，V 为实际访问的搜索节点数，R 为输出组合数；该输出敏感上界计入每个节点最多扫描 n 个候选及结果复制。V 最坏呈指数增长，不能概括为 O(n)。排序复制占 O(n)，输出最多 O(RD)。", "pitfalls": ["允许重复使用，递归起点是 i 而非 i + 1。", "候选全为正数是终止与剪枝成立的条件。", "限定下标不回退可去除同一组合的不同排列。"], "code": "from typing import List\n\nclass Solution:\n    def combinationSum(self, candidates: List[int], target: int) -> List[List[int]]:\n        values = sorted(candidates)\n        answer, path = [], []\n        def dfs(start, remain):\n            if remain == 0:\n                answer.append(path.copy())\n                return\n            for i in range(start, len(values)):\n                value = values[i]\n                if value > remain:\n                    break\n                path.append(value)\n                dfs(i, remain - value)\n                path.pop()\n        dfs(0, target)\n        return answer\n"}, {"order": 59, "id": 22, "title": "括号生成", "english_title": "Generate Parentheses", "slug": "generate-parentheses", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/generate-parentheses/", "summary": "生成由 n 对括号组成的全部合法括号字符串。", "approach": "回溯时分别记录左右括号数量，只扩展仍可能合法的前缀。", "steps": ["当左括号少于 n 时，可以添加一个左括号。", "当右括号少于已添加的左括号时，可以添加一个右括号。", "路径长度达到 2n 时记录结果。", "递归返回后撤销最后一个括号，继续另一条分支。"], "why": "所有前缀都保持右括号不多于左括号，最终左右均为 n，因此每个结果合法；任何合法序列的每一个前缀满足此条件，所以全部合法序列都能生成。", "time_complexity": "O(n · C_n)", "space_complexity": "O(n)，不含输出", "complexity_notes": "C_n 为第 n 个 Catalan 数，即合法结果数量；复制长度 2n 的结果占主导，输出占 O(nC_n)，路径和递归栈占 O(n)。", "pitfalls": ["右括号数量必须严格少于左括号数量时才能添加。", "只控制最终左右数量相等还不够，前缀也必须合法。"], "code": "from typing import List\n\nclass Solution:\n    def generateParenthesis(self, n: int) -> List[str]:\n        answer, path = [], []\n        def dfs(left, right):\n            if len(path) == 2 * n:\n                answer.append(\"\".join(path))\n                return\n            if left \u003c n:\n                path.append(\"(\")\n                dfs(left + 1, right)\n                path.pop()\n            if right \u003c left:\n                path.append(\")\")\n                dfs(left, right + 1)\n                path.pop()\n        dfs(0, 0)\n        return answer\n"}, {"order": 60, "id": 79, "title": "单词搜索", "english_title": "Word Search", "slug": "word-search", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/word-search/", "summary": "判断字符网格中是否存在一条上下左右相邻、不重复使用格子的路径，依次拼出目标单词。", "approach": "从可能的首字符位置进行 DFS，临时标记已使用格子，递归结束后恢复。", "steps": ["尝试每一个格子作为单词起点。", "进入 dfs 时先检查边界和当前字符是否匹配。", "暂时把格子设成不属于合法字母的标记，再搜索四个相邻位置。", "无论成功还是失败，都恢复原字符；某个起点成功即返回 True。"], "why": "递归路径每层匹配一个新字符，标记禁止复用当前路径内的格子；恢复操作使不同候选路径互不干扰，所以恰好搜索全部合法路径。", "time_complexity": "O(mn · 3^L)", "space_complexity": "O(L)", "complexity_notes": "L 为单词长度，这是粗略上界：首步最多 4 个方向，之后由于不能回到上一个格子最多 3 个方向；递归最多 L 层。代码不建立 visited 矩阵，并且会恢复输入。", "pitfalls": ["成功返回之前也要恢复格子，不能让输入残留标记。", "同一格子在一次路径中不可重复，不同路径中可以重新使用。", "对角相邻不合法。"], "code": "from typing import List\n\nclass Solution:\n    def exist(self, board: List[List[str]], word: str) -> bool:\n        if not word:\n            return True\n        if not board or not board[0]:\n            return False\n        m, n = len(board), len(board[0])\n        if len(word) > m * n:\n            return False\n        def dfs(r, c, i):\n            if not (0 \u003c= r \u003c m and 0 \u003c= c \u003c n) or board[r][c] != word[i]:\n                return False\n            if i == len(word) - 1:\n                return True\n            saved = board[r][c]\n            board[r][c] = \"#\"\n            found = (dfs(r + 1, c, i + 1) or dfs(r - 1, c, i + 1)\n                     or dfs(r, c + 1, i + 1) or dfs(r, c - 1, i + 1))\n            board[r][c] = saved\n            return found\n        return any(dfs(r, c, 0) for r in range(m) for c in range(n))\n"}, {"order": 61, "id": 131, "title": "分割回文串", "english_title": "Palindrome Partitioning", "slug": "palindrome-partitioning", "difficulty": "MEDIUM", "category": "回溯", "url": "https://leetcode.cn/problems/palindrome-partitioning/", "summary": "把字符串切成若干连续片段，输出所有每个片段都是回文串的切分方案。", "approach": "先用动态规划预计算子串是否回文，再回溯枚举下一段的结束位置。", "steps": ["从右向左计算 pal[i][j]：首尾相同且内部回文时，这段也是回文。", "在 start 处枚举 end，只选择 pal[start][end] 为真的片段。", "选取后递归到 end + 1，并在返回时撤销片段。", "start 到达字符串结尾时复制当前方案。"], "why": "动态规划准确判定每个候选片段；回溯对每个切分点完整枚举，只接受回文片段，因此生成的方案全部合法且每种切法只生成一次。", "time_complexity": "O(n² + n · 2^n)", "space_complexity": "O(n²)，不含输出", "complexity_notes": "n 为字符串长度；至多有 2^(n-1) 种切法，切片和结果复制需计入时间。回文表 O(n²)、递归与当前路径字符总量 O(n)；输出字符总量上界 O(n·2^n)。", "pitfalls": ["初始化长度 1 和 2 的子串时，内部为空也应视为回文。", "保存方案时复制 path。", "递归起点必须是当前片段之后的位置。"], "code": "from typing import List\n\nclass Solution:\n    def partition(self, s: str) -> List[List[str]]:\n        n = len(s)\n        pal = [[False] * n for _ in range(n)]\n        for i in range(n - 1, -1, -1):\n            for j in range(i, n):\n                pal[i][j] = s[i] == s[j] and (j - i \u003c 2 or pal[i + 1][j - 1])\n        answer, path = [], []\n        def dfs(start):\n            if start == n:\n                answer.append(path.copy())\n                return\n            for end in range(start, n):\n                if pal[start][end]:\n                    path.append(s[start:end + 1])\n                    dfs(end + 1)\n                    path.pop()\n        dfs(0)\n        return answer\n"}, {"order": 62, "id": 51, "title": "N 皇后", "english_title": "N-Queens", "slug": "n-queens", "difficulty": "HARD", "category": "回溯", "url": "https://leetcode.cn/problems/n-queens/", "summary": "在 n×n 棋盘放置 n 个皇后，使任意两个不在同一行、列或对角线，输出所有布局。", "approach": "逐行放置皇后，用列集合和两类对角线集合快速判断冲突。", "steps": ["每层只处理一行，因此天然避免同行冲突。", "候选列 c 若不在 columns、row-c 和 row+c 的占用集合中，就能放置。", "放置后更新三组占用信息，递归下一行；返回后撤销。", "放满 n 行后，将每行的列下标转换成由 '.' 和 'Q' 组成的棋盘。"], "why": "行号固定、列和对角线集合准确描述已有皇后的攻击范围；只扩展无冲突位置，且每行尝试所有列，因此输出合法并覆盖全部布局。", "time_complexity": "O(n · n! + R · n²)，保守上界", "space_complexity": "O(n)，不含输出", "complexity_notes": "R 为合法布局数量。忽略对角剪枝时，搜索节点数受不重复列排列数量约束；本实现每个节点扫描 n 列，另需为每个结果构造 n² 个字符。输出空间 O(Rn²)。", "pitfalls": ["两种对角线分别用 row-col 和 row+col 标识。", "撤销时三组集合与路径都要恢复。", "n=2 或 n=3 没有解。"], "code": "from typing import List\n\nclass Solution:\n    def solveNQueens(self, n: int) -> List[List[str]]:\n        answer, path = [], []\n        columns, diag_down, diag_up = set(), set(), set()\n        def dfs(row):\n            if row == n:\n                answer.append([\".\" * col + \"Q\" + \".\" * (n - col - 1)\n                               for col in path])\n                return\n            for col in range(n):\n                if col in columns or row - col in diag_down or row + col in diag_up:\n                    continue\n                columns.add(col)\n                diag_down.add(row - col)\n                diag_up.add(row + col)\n                path.append(col)\n                dfs(row + 1)\n                path.pop()\n                columns.remove(col)\n                diag_down.remove(row - col)\n                diag_up.remove(row + col)\n        dfs(0)\n        return answer\n"}, {"order": 63, "id": 35, "title": "搜索插入位置", "english_title": "Search Insert Position", "slug": "search-insert-position", "difficulty": "EASY", "category": "二分查找", "url": "https://leetcode.cn/problems/search-insert-position/", "summary": "在升序数组中找到目标的位置；目标不存在时返回维持升序应插入的下标。", "approach": "二分寻找第一个大于等于 target 的位置，也就是 lower_bound。", "steps": ["使用左闭右开区间 [left, right)，初始 right=len(nums)。", "若 nums[mid] 小于 target，则答案一定在 mid 右侧，令 left=mid+1。", "否则 mid 可能是答案，保留它，令 right=mid。", "两端重合时返回 left，允许答案等于数组长度。"], "why": "循环始终保持 left 之前的元素均小于 target、right 及之后的元素均不小于 target；区间缩空后边界就是首个不小于目标的位置。", "time_complexity": "O(log n)", "space_complexity": "O(1)", "complexity_notes": "n 为数组长度；无需切片或额外数组。空数组扩展情形返回 0。", "pitfalls": ["使用右开区间时，right 更新为 mid 而不是 mid-1。", "目标大于全部元素时，插入位置是 n。"], "code": "from typing import List\n\nclass Solution:\n    def searchInsert(self, nums: List[int], target: int) -> int:\n        left, right = 0, len(nums)\n        while left \u003c right:\n            mid = (left + right) // 2\n            if nums[mid] \u003c target:\n                left = mid + 1\n            else:\n                right = mid\n        return left\n"}, {"order": 64, "id": 74, "title": "搜索二维矩阵", "english_title": "Search a 2D Matrix", "slug": "search-a-2d-matrix", "difficulty": "MEDIUM", "category": "二分查找", "url": "https://leetcode.cn/problems/search-a-2d-matrix/", "summary": "矩阵每行升序，且下一行首元素大于上一行末元素，判断目标是否存在。", "approach": "将矩阵视为长度 mn 的虚拟有序数组，通过整除与取模访问位置并二分。", "steps": ["题目的跨行顺序保证按行展平后整体升序。", "虚拟下标 mid 对应行 mid//n、列 mid%n。", "根据该元素与 target 的大小缩小二分区间。", "找到相等值返回 True；搜索区间为空则不存在。"], "why": "虚拟下标到矩阵坐标是一一映射，且映射后的序列有序，因此标准二分每次排除不可能包含目标的一半区间。", "time_complexity": "O(log(mn))", "space_complexity": "O(1)", "complexity_notes": "m、n 为行列数；没有真正展平矩阵，所以无需 O(mn) 的数组副本。", "pitfalls": ["本题的跨行排序条件比第 240 题更强，不能混用。", "映射时除数是列数 n。"], "code": "from typing import List\n\nclass Solution:\n    def searchMatrix(self, matrix: List[List[int]], target: int) -> bool:\n        if not matrix or not matrix[0]:\n            return False\n        m, n = len(matrix), len(matrix[0])\n        left, right = 0, m * n - 1\n        while left \u003c= right:\n            mid = (left + right) // 2\n            value = matrix[mid // n][mid % n]\n            if value == target:\n                return True\n            if value \u003c target:\n                left = mid + 1\n            else:\n                right = mid - 1\n        return False\n"}, {"order": 65, "id": 34, "title": "在排序数组中查找元素的第一个和最后一个位置", "english_title": "Find First and Last Position of Element in Sorted Array", "slug": "find-first-and-last-position-of-element-in-sorted-array", "difficulty": "MEDIUM", "category": "二分查找", "url": "https://leetcode.cn/problems/find-first-and-last-position-of-element-in-sorted-array/", "summary": "在含重复值的非递减数组中，返回目标第一次和最后一次出现的位置；不存在时返回 [-1,-1]。", "approach": "分别二分寻找第一个 >=target 的位置和第一个 >target 的位置，两者确定目标区间。", "steps": ["定义边界函数，strict=False 寻找 >=target，strict=True 寻找 >target。", "求左边界并检查是否越界或值不等于 target。", "不存在则直接返回 [-1,-1]。", "存在时，最后位置等于严格右边界减一。"], "why": "排序使所有等于 target 的元素形成连续区间；两个二分边界恰好夹住这一整段，右边界是第一个更大值，故其前一个位置是最后出现位置。", "time_complexity": "O(log n)", "space_complexity": "O(1)", "complexity_notes": "两次二分均不构造子数组；空数组也可正确处理。", "pitfalls": ["左边界可能等于 len(nums)，检查后再访问。", "右边界是第一处大于目标的位置，需减一。", "找到某个相等元素后向两边线性扫描会退化为 O(n)。"], "code": "from typing import List\n\nclass Solution:\n    def searchRange(self, nums: List[int], target: int) -> List[int]:\n        def boundary(strict):\n            left, right = 0, len(nums)\n            while left \u003c right:\n                mid = (left + right) // 2\n                if nums[mid] \u003c target or (strict and nums[mid] == target):\n                    left = mid + 1\n                else:\n                    right = mid\n            return left\n        first = boundary(False)\n        if fi
